<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BOLSODRIVE · cartão</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=1200">
<!-- O cartão de um tópico (1200×630), para a prévia de link e o envio com imagem.
     cartao.html?id=<id> lê window.BD_TOPICOS[id].cartao = {k, nome, n, l} de data/topicos.js.
     As imagens c/img/<id>.png saem daqui (bolso-os-fontes/gera_compartilhar.py). -->
<style>
:root{--papel:#070a07; --tinta:#d8efdd; --cinza:#86a58c; --cinza2:#4f6b51; --amber:#ffb02e; --agua:#7df59a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html,body{margin:0; padding:0; background:var(--papel)}
.c{position:relative; width:1200px; height:630px; overflow:hidden; background:var(--papel); color:var(--tinta); font-family:var(--sans)}
.logo{position:absolute; left:64px; top:50px; width:262px; height:auto; display:block}
.txt{position:absolute; left:64px; top:136px; width:800px}
.k{font-family:var(--mono); font-size:18px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--cinza); margin:0 0 12px}
.nome{font-size:54px; font-weight:800; line-height:1.04; letter-spacing:-.015em; margin:0 0 6px}
.num{font-size:168px; font-weight:800; line-height:1; letter-spacing:-.035em; color:var(--amber); white-space:nowrap; margin:0 0 10px}
.l{font-size:31px; line-height:1.24; color:#b3cdb8; margin:0}
svg.rio{position:absolute; left:870px; top:0; width:330px; height:630px}
</style>
</head>
<body>
<div class="c" id="c">
  <img class="logo" src="assets/marca/logo.svg" alt="BOLSODRIVE">
  <div class="txt" id="txt">
    <p class="k" id="k"></p>
    <p class="nome" id="nome"></p>
    <p class="num" id="num"></p>
    <p class="l" id="l"></p>
  </div>
  <svg class="rio" id="rio" viewBox="0 0 330 630" aria-hidden="true"></svg>
</div>
<script src="data/topicos.js?v=3"></script>
<script>
(function(){
'use strict';
const T = window.BD_TOPICOS || {};
const id = new URLSearchParams(location.search).get('id') || 'abertura';
const t = T[id] || T.abertura || { cartao: { k: 'Flávio Bolsonaro', nome: 'Um rio de escândalos', n: '', l: '' } };
const c = t.cartao || {};
const $ = s => document.getElementById(s);
$('k').textContent = c.k || 'Flávio Bolsonaro';
$('nome').textContent = c.nome || '';
$('num').textContent = c.n || '';
if (c.cor === 'tinta') $('num').style.color = 'var(--tinta)';   /* a situação dele: nunca em âmbar */
$('l').textContent = c.l || '';
document.title = (c.nome || 'BOLSODRIVE') + ' · cartão';

/* o afluente: desce do alto até o ponto (ele); a forma varia um pouco por tópico */
let h = 2166136261; for (let i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
const P = { x: 168, y: 486 };                                   /* o ponto */
const x0 = 120 + rnd() * 110, a1 = 40 + rnd() * 50, a2 = 30 + rnd() * 40, s = rnd() < .5 ? -1 : 1;
const main = `M${x0.toFixed(1)},-10 C${(x0 + s * a1).toFixed(1)},120 ${(P.x - s * a2).toFixed(1)},250 ${(P.x + s * 18).toFixed(1)},340 S${P.x},440 ${P.x},${P.y - 40}`;
/* dois afluentes menores: um desce do alto, outro entra pela borda direita; os dois encontram o principal */
const t1x = s > 0 ? 40 + rnd() * 40 : 250 + rnd() * 40;
const trib1 = `M${t1x.toFixed(1)},-10 C${t1x.toFixed(1)},110 ${(P.x - s * 70).toFixed(1)},200 ${(P.x + s * 14).toFixed(1)},318`;
const t2y = 150 + rnd() * 90;
const trib2 = `M340,${t2y.toFixed(1)} C260,${(t2y + 40).toFixed(1)} ${(P.x + 50).toFixed(1)},330 ${(P.x + 6).toFixed(1)},404`;
const NS = 'http://www.w3.org/2000/svg';
const svg = $('rio');
svg.innerHTML =
  '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7df59a" stop-opacity=".12"/><stop offset=".75" stop-color="#7df59a" stop-opacity=".75"/><stop offset="1" stop-color="#7df59a" stop-opacity=".95"/></linearGradient>' +
  '<radialGradient id="aura"><stop offset="0" stop-color="#7df59a" stop-opacity=".28"/><stop offset="1" stop-color="#7df59a" stop-opacity="0"/></radialGradient></defs>' +
  `<path d="${trib1}" fill="none" stroke="#7df59a" stroke-opacity=".22" stroke-width="2.5" stroke-linecap="round"/>` +
  `<path d="${trib2}" fill="none" stroke="#7df59a" stroke-opacity=".18" stroke-width="2" stroke-linecap="round"/>` +
  `<path d="${main}" fill="none" stroke="url(#g)" stroke-width="22" stroke-opacity=".22" stroke-linecap="round"/>` +
  `<path d="${main}" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>` +
  `<circle cx="${P.x}" cy="${P.y}" r="92" fill="url(#aura)"/>` +
  `<circle cx="${P.x}" cy="${P.y}" r="40" fill="#0e160e" stroke="#7df59a" stroke-width="3"/>` +
  `<text x="${P.x}" y="${P.y + 8}" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#d8efdd">FB</text>`;
/* gotas descendo o afluente principal */
const guia = document.createElementNS(NS, 'path'); guia.setAttribute('d', main); svg.appendChild(guia); guia.setAttribute('fill', 'none');
const L = guia.getTotalLength();
[0.18, 0.36, 0.52, 0.66, 0.78, 0.88].forEach((f, i) => {
  const p = guia.getPointAtLength(L * f), g = document.createElementNS(NS, 'circle');
  g.setAttribute('cx', p.x.toFixed(1)); g.setAttribute('cy', p.y.toFixed(1)); g.setAttribute('r', (2.6 + i * .35).toFixed(2));
  g.setAttribute('fill', '#e8ffec'); g.setAttribute('fill-opacity', (0.45 + i * .08).toFixed(2)); svg.appendChild(g);
});

/* ajuste: o número cabe numa linha; o bloco cabe na altura */
function ajusta(){
  const txt = $('txt'), num = $('num'), l = $('l'), nome = $('nome');
  let fs = 168; num.style.fontSize = fs + 'px';
  while (num.scrollWidth > 800 && fs > 70){ fs -= 4; num.style.fontSize = fs + 'px'; }
  let ls = 31, ns = 54;
  const cabe = () => txt.offsetHeight <= 444;
  while (!cabe() && fs > 96){ fs -= 4; num.style.fontSize = fs + 'px'; }
  while (!cabe() && ls > 25){ ls -= 1; l.style.fontSize = ls + 'px'; }
  while (!cabe() && ns > 48){ ns -= 2; nome.style.fontSize = ns + 'px'; }
  txt.style.top = Math.round(136 + Math.max(0, 444 - txt.offsetHeight) / 2) + 'px';   /* centrado no espaço abaixo do logo */
  document.documentElement.dataset.pronto = '1';
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(ajusta);
})();
</script>
</body>
</html>
