<style>
.wrap{max-width:760px}
.kicker.trecho{margin:0 0 4px; color:var(--cinza); font-weight:400}
.tese{font-size:17px; line-height:1.5; margin:0 0 12px}
.tese b{color:var(--amber)}
.faixas{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 26px}
.faixas button{display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:9px 10px; border:1px solid var(--linha); border-radius:4px; background:var(--leve); color:var(--tinta); cursor:pointer; font:inherit; text-align:left; min-height:44px}
.faixas button b{font-family:var(--mono); font-size:22px; color:var(--amber); line-height:1}
.faixas button span{font-size:13px; color:var(--cinza); line-height:1.25}
.faixas button.on{border-color:var(--amber)}
@media (max-width:520px){ .faixas{grid-template-columns:repeat(2,1fr)} }

/* bacia: o rio de verdade (canvas) com nomes em HTML por cima */
.bacia{position:relative; margin:0 0 8px; border:1px solid var(--linha); border-radius:4px; background:#050805; overflow:hidden; min-height:200px}
.bacia canvas{position:absolute; left:0; top:0; display:block}
.bacia .rotulos{position:absolute; left:0; top:0; right:0; bottom:0}
.bacia .rt{position:absolute; display:flex; align-items:center; margin:0; border:0; border-radius:3px; background:transparent; cursor:pointer; font-family:var(--sans); font-weight:600; text-align:left; -webkit-tap-highlight-color:transparent; transition:opacity .2s}
.bacia .rt.d{justify-content:flex-end; text-align:right}
.bacia .rt span{white-space:nowrap; text-shadow:0 0 4px #050805, 0 0 8px #050805; transition:opacity .2s}
.bacia .rt:hover span, .bacia .rt:active span{text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.bacia .rt:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
.bacia .rt.dim span{opacity:.3}
.bacia .bh{position:absolute; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--amber); white-space:nowrap; pointer-events:none}
.bacia .bh i{font-style:normal; color:var(--cinza2)}
.bacia .foz-b{position:absolute; border-radius:50%; overflow:hidden; border:2px solid var(--tinta); transition:border-color .18s; background:#050805; display:flex; align-items:center; justify-content:center; font:800 22px var(--sans); color:var(--cinza); pointer-events:none}
.bacia .foz-b img{position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block}
.bacia .foz-n{position:absolute; transform:translateX(-50%); text-align:center; white-space:nowrap; pointer-events:none}
.bacia .foz-n b{display:block; font-family:var(--mono); font-size:13px; color:var(--tinta); letter-spacing:.06em}
.bacia .foz-n span{display:block; font-size:13px; color:var(--cinza); margin-top:2px}
.bacia .foz-b.pulso{animation:pulso 1.4s ease-out 1}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(216,239,221,.6)} 100%{box-shadow:0 0 0 22px rgba(216,239,221,0)}}
@media (max-width:639px){ .bacia{margin:0 -16px 8px; border-radius:0; border-left:0; border-right:0} }
@media (min-width:1000px){ .bacia{width:min(1100px, calc(100vw - 64px)); margin-left:calc(50% - min(550px, 50vw - 32px))} }
.legenda{font-family:var(--mono); font-size:12px; color:var(--cinza); display:flex; gap:6px 16px; flex-wrap:wrap; margin:8px 0 8px}
.legenda i{display:inline-block; width:18px; height:4px; border-radius:2px; vertical-align:3px; margin-right:6px}
.legenda i.pt{width:6px; height:6px; border-radius:50%; background:#fff4dc; box-shadow:0 0 5px 1px var(--amber); margin:0 12px 0 6px; vertical-align:1px}
.cap{font-size:15px; color:var(--cinza); margin:0 0 14px}

/* rio para rolar */
h2.sec2{font-family:var(--mono); font-size:15px; color:var(--amber); letter-spacing:2px; text-transform:uppercase; margin:10px 0 4px}
h2.sec2::before{content:"// "; color:var(--cinza2)}
.rio{position:relative; margin:8px 0 0}
.rio > svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
.rio .lane{fill:none; stroke-linecap:butt; stroke-linejoin:round; opacity:.82}
.rio .lane.anim{stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset 1.5s cubic-bezier(.3,.6,.3,1)}
.rio .lane.anim.on{stroke-dashoffset:0}
.rio .lane.dim{opacity:.12}
.trechos{position:relative}
.trecho-h{font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--linha)}
.trecho-h:first-child{margin-top:4px}
.trecho-h span{color:var(--cinza); text-transform:none; letter-spacing:0; font-weight:400}
.afl{display:block; width:100%; text-align:left; padding:10px 12px 11px; margin:0 0 12px; border:1px solid var(--linha); border-radius:4px; background:var(--leve); color:var(--tinta); cursor:pointer; font:inherit; transition:border-color .2s, box-shadow .2s}
.afl:hover, .afl.flash{border-color:var(--amber)}
.afl.flash{box-shadow:0 0 0 2px rgba(255,176,46,.35)}
.afl .n{font-size:16px; font-weight:700; display:block; line-height:1.25}
.afl .via{font-size:13px; color:var(--cinza); display:block; margin:3px 0 6px; line-height:1.35}
.afl .sf{display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; padding:3px 7px; border:1px solid var(--cinza2); border-radius:2px; color:var(--cinza)}
.afl .mais{font-family:var(--mono); font-size:11px; color:var(--azul); display:block; margin-top:6px}
.foz{position:absolute; transform:translateX(-50%); text-align:center; width:220px}
.foz .disco{width:92px; height:92px; border-radius:50%; margin:0 auto 8px; overflow:hidden; border:3px solid var(--tinta); background:var(--leve); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; color:var(--cinza)}
.foz .disco img{width:100%; height:100%; object-fit:cover}
.foz b{display:block; font-family:var(--mono); font-size:14px; color:var(--tinta); letter-spacing:.06em}
.foz span{display:block; font-size:13px; color:var(--cinza); margin-top:2px}

.ressalva{font-size:13px; color:var(--cinza); border-left:2px solid var(--cinza2); padding:2px 0 2px 10px; margin:0 0 14px}
.ressalva b{color:var(--tinta)}
.metodo{font-size:13px; color:var(--cinza); border-top:1px solid var(--linha); margin-top:28px; padding-top:14px}
.fim-rio{margin:6px 0 0; text-align:center}
.fim-rio .fr-t{margin:0; font-size:22px; font-weight:700; color:var(--tinta)}
.fim-rio .acoes{justify-content:center; margin-top:12px}
.fim-rio .fr-links{display:flex; flex-direction:column; align-items:center; margin-top:14px}
.fim-rio .fr-links a{display:inline-flex; align-items:center; min-height:44px; padding:0 6px; font-size:16px; font-weight:600; color:var(--amber); text-decoration:none}
.fim-rio .fr-links a:hover{text-decoration:underline; text-underline-offset:3px}
.fim-rio .fr-links a.fr-volta{font-family:var(--mono); font-size:13px; font-weight:400; letter-spacing:.06em; color:var(--cinza)}
/* o "depois da foz" do cabeçalho (assets/nav.js) repetiria o link do quiz logo abaixo deste bloco */
body[data-trecho="3"] .nv-segue{display:none}

/* ficha do afluente */
.folha{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:60}
.folha.on{display:block}
.folha .cx{position:absolute; left:0; right:0; bottom:0; max-height:86vh; overflow:auto; background:#0a100a; border-top:1px solid var(--linha); padding:16px 16px 30px; border-radius:14px 14px 0 0}
@media (min-width:760px){ .folha .cx{left:50%; transform:translateX(-50%); width:720px; border:1px solid var(--linha)} }
.folha .fx{position:sticky; top:0; float:right; background:#0a100a; border:1px solid var(--linha); color:var(--tinta); border-radius:3px; padding:0 12px; min-height:44px; cursor:pointer; font-family:var(--mono)}
.folha h3{font-size:21px; margin:4px 0 2px; line-height:1.2}
.folha .op{font-family:var(--mono); font-size:12px; color:var(--cinza); margin:0 0 10px}
.folha .res{font-size:15px; margin:0 0 12px}
.ele{border:1px solid var(--tinta); border-radius:4px; padding:10px 12px; margin:0 0 14px}
.ele .k{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--tinta); display:block; margin-bottom:3px}
.cam{list-style:none; margin:0 0 14px; padding:0; border-left:2px solid var(--cinza2)}
.cam li{position:relative; padding:0 0 12px 16px}
.cam li::before{content:""; position:absolute; left:-6px; top:5px; width:10px; height:10px; border-radius:50%; background:#0a100a; border:2px solid var(--cinza)}
.cam li.grave::before{border-color:var(--carimbo)}
.cam li.medio::before{border-color:var(--amber)}
.cam .de{font-weight:700}
.cam .rel{display:block; font-size:14px; color:var(--tinta); margin:2px 0}
.cam .stt{display:block; font-family:var(--mono); font-size:11px; color:var(--cinza)}
.cam .ft{font-family:var(--mono); font-size:11px}
.cam li.fim::before{background:var(--tinta); border-color:var(--tinta)}
.cam .roda{display:inline-flex; align-items:center; min-height:36px; margin-right:12px; font-family:var(--mono); font-size:12px; color:var(--amber); text-decoration:none}
.cam .roda:hover{text-decoration:underline; text-underline-offset:3px}

/* o número do caso (data/foz.js: numero {valor, texto, fonte}): nunca aparece sem o texto,
   que diz quem afirma e em que pé está */
.nb{margin:8px 0 14px; padding:0 0 14px; border-bottom:1px solid var(--linha)}
.nb-n{margin:0; color:var(--amber); font-weight:800; font-size:clamp(44px,13vw,80px); line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.nb-n .p, .nb-n .u{font-size:.42em; font-weight:700; letter-spacing:0}
.nb-n .v{display:inline-grid}
.nb-n .v > span{grid-area:1/1}
.nb-n .v .fant{visibility:hidden}
.nb-t{margin:10px 0 4px; font-size:16px; line-height:1.45; color:var(--tinta); max-width:36em}
.nb-s{margin:0 0 6px; font-size:14px; line-height:1.45; color:var(--tinta); max-width:36em; padding-left:10px; border-left:2px solid var(--tinta)}
.nb-n.frase{font-size:clamp(30px,8.8vw,50px); line-height:1.04; letter-spacing:-.015em; text-wrap:balance; overflow-wrap:normal; hyphens:none; max-width:12em}
.nb-f{margin:0; font-family:var(--mono); font-size:12px; color:var(--cinza)}
.nb-f a{display:inline-block; padding:10px 0; margin:-6px 0 -10px; color:var(--azul)}
.afl .an{display:block; margin:6px 0 8px}

/* Caso Marielle: destaque no alto (depois da tese), sempre com a situação dele e as ressalvas junto */
.dq{margin:0 0 22px; padding:14px 16px 12px; border:1px solid var(--linha); border-left:3px solid var(--tinta); border-radius:4px; background:var(--leve)}
.dq h2{margin:0 0 8px; font-size:22px; line-height:1.15; font-weight:800; color:var(--tinta)}
.dq h2 b{color:var(--amber); font-variant-numeric:tabular-nums; white-space:nowrap}
.dq .dq-t{margin:0 0 10px; font-size:17px; line-height:1.45; color:var(--tinta)}
.dq .dq-s{margin:0 0 6px; font-size:15px; line-height:1.45; color:var(--tinta); padding-left:10px; border-left:2px solid var(--tinta)}
.dq .dq-r{margin:0 0 8px; font-size:14px; line-height:1.45; color:var(--cinza)}
.dq .dq-a{display:flex; flex-wrap:wrap; align-items:center; gap:0 18px}
.dq .dq-a > a{display:inline-flex; align-items:center; min-height:44px; font-size:16px; font-weight:700; color:var(--amber); text-decoration:none}
.dq .dq-a > a.teia{font-weight:600; font-size:15px; color:var(--tinta)}
.dq .dq-a > a:hover{text-decoration:underline; text-underline-offset:3px}
.dq .dq-f{font-family:var(--mono); font-size:12px; color:var(--cinza)}
.dq .dq-f a{display:inline-block; padding:10px 0; margin:-10px 0; color:var(--azul)}
.dq .dq-f.lista{flex-basis:100%; margin-top:4px}
.dq .dq-f.lista .dq-fi{display:block; padding:3px 0}
@media (min-width:640px){ .dq{padding:18px 20px 14px} .dq h2{font-size:26px} }
.bacia .rt.forte span{font-weight:800}
/* ficha do caso Marielle: as duas ligações, com a pena de cada um e a fonte */
.lig{list-style:none; margin:0 0 14px; padding:0}
.lig li{padding:10px 0 10px 14px; border-top:1px solid var(--linha); position:relative}
.lig li:last-child{border-bottom:1px solid var(--linha)}
.lig li::before{content:""; position:absolute; left:0; top:17px; width:7px; height:7px; border-radius:50%; background:var(--carimbo)}
.lig b{display:block; font-size:16px}
.lig .pena{display:block; font-family:var(--mono); font-size:11.5px; color:var(--cinza); margin:1px 0 4px}
.lig .lg{display:block; font-size:15px; line-height:1.45}
.lig a{font-family:var(--mono); font-size:11px}
.lig-k{margin:0 0 4px}
.afl .an b{display:block; font-size:27px; font-weight:800; line-height:1.05; letter-spacing:-.01em; color:var(--amber); font-variant-numeric:tabular-nums}
.afl .an b .p, .afl .an b .u{font-size:.58em; font-weight:700; letter-spacing:0}
.afl .an .t{display:block; font-size:14px; line-height:1.4; color:var(--tinta); margin-top:3px}
.afl .an b.frase{font-size:23px; line-height:1.1; letter-spacing:-.005em; text-wrap:balance}

/* versão enxuta: título, número, uma frase; o resto atrás de "ler mais" */
.legenda{font-family:var(--sans); font-size:12px; gap:4px 12px; margin:8px 0 4px}
.legenda span{white-space:nowrap}
.legenda i{width:14px; margin-right:5px}
.cap{font-size:14px; margin:0 0 12px}
.faixas button{flex-direction:row; align-items:baseline; gap:8px}
.faixas button span{font-size:14px; color:var(--tinta)}
.afl .sf{border-color:var(--tinta); color:var(--tinta); margin-top:2px}
.afl .via{color:var(--tinta); font-size:14px; margin:4px 0 2px}
.acoes .env, .env{display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; font-size:15px; font-weight:700; padding:0 18px; border-radius:2px; border:1.5px solid var(--amber); background:var(--amber); color:#120c00; cursor:pointer; font-family:var(--sans)}
.dq{padding:14px 16px 10px}
.dq .dq-n{margin:0; color:var(--amber); font-weight:800; font-size:clamp(44px,13vw,72px); line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.dq .dq-n.frase{margin:2px 0 8px; font-size:clamp(30px,8.8vw,46px); line-height:1.04; letter-spacing:-.015em; text-wrap:balance; overflow-wrap:normal; hyphens:none; max-width:12em}
.dq h2{margin:0 0 6px; font-size:20px}
.dq .dq-t{margin:0 0 6px; font-size:16px}
.dq .dq-a{gap:4px 16px}
.nb{margin:8px 0 12px; padding:0 0 12px}
.nb-t{margin:8px 0 6px}
.ele-l{margin:0 0 6px; font-size:14px; line-height:1.4; color:var(--tinta); padding-left:10px; border-left:2px solid var(--tinta)}
.ele-l b{font-family:var(--mono); font-size:11px; letter-spacing:.08em; font-weight:700; margin-right:6px}
.folha .acoes{margin:0 0 16px; align-items:center}
.folha .acoes a.sec{display:inline-flex; align-items:center; min-height:44px; padding:0 12px; font-size:14px}
.cam .rel, .cam .ft, .cam .roda, .cam .stt.mx{display:none}
.aberta .cam .rel{display:block}
.aberta .cam .ft, .aberta .cam .roda{display:inline-flex}
.aberta .cam .stt.mx{display:block}
.aberta .cam .stt.cu{display:none}
.aberta .cam .ft{margin-right:12px}
.cam .ft, .cam .roda{min-height:36px; align-items:center}
.mais-box{display:none; border-top:1px solid var(--linha); padding-top:12px; margin-top:4px}
.aberta .mais-box{display:block}
.mais-box .op{margin:0 0 8px}
.mais-box .res{font-size:15px; line-height:1.5}
.mais-box .ver{font-size:14px; line-height:1.45; color:var(--cinza); margin:0 0 12px}
.lm{display:inline-flex; align-items:center; min-height:44px; padding:0; margin:0 0 6px; border:0; background:none; color:var(--amber); font:600 15px var(--sans); cursor:pointer}
.lm:hover{text-decoration:underline; text-underline-offset:3px}
.cam-mari{display:none}
.aberta .cam-mari{display:block}
</style>
</head>

<script>
/* =====================================================================
   RIO: motor de água do BolsoDrive. Canvas 2D, sem dependências.
   A abertura e a Foz usam este mesmo motor: é o mesmo rio.

   Conceitos
     curso  caminho reamostrado a cada RIO.PASSO px, com largura e cor por ponto:
            { x[], y[], s[] (comprimento acumulado), nx[], ny[] (normal),
              w[] (largura), c[] (cor [r,g,b]), n (pontos), L (comprimento) }
     rota   cursos emendados, da nascente até a foz; é por onde a gota corre.
     gota   partícula luminosa que desce uma rota, na cor da sua nascente.

   Geometria
     RIO.curso(pts)                 [[x,y],...] -> curso reamostrado, com normais
     RIO.bezier(p0,p1,p2,p3,n)      pontos de uma cúbica
     RIO.meandro(a, b, op)          afluente sinuoso de a=[x,y] até b=[x,y]
                                    op: { amp, ondas (meias voltas), fase, ta:[dx,dy] saída, tb:[dx,dy] chegada }
     RIO.pinta(curso, fn)           fn(i, y, t) -> [largura, cor]; t = fração do comprimento
     RIO.rota([curso,i0,i1], ...)   emenda trechos numa rota contínua
     RIO.primeiro(arr, v)           primeiro índice com arr[i] >= v (arr crescente)

   Desenho parado (uma vez por layout, numa camada própria)
     RIO.leito(ctx, lista, op)      lista [{curso, fosco 0..1}]: halo, corpo e reflexo, com
                                    as cores já misturadas ao fundo (sem blur por quadro)
                                    op: { fundo:[r,g,b], foz:{x,y,r,cor,aro,fosco} } (aro: cor fixa do anel em volta da foz)
     RIO.traco(ctx, rota, cor, lw)  realce de uma rota inteira (nascente -> foz)
     RIO.setas(ctx, curso, cor, d)  setas de sentido a cada d px (versão parada)

   Movimento
     RIO.correnteza(canvas, cena)   -> { liga(), desliga(), quadro(), marca(fn), medir(n) }; fica também em canvas.rio
        cena: { W, H, dpr, vel (px/s), raio,
                cursos:[{curso, id, grupo}]   traços da correnteza (mais lentos junto à margem)
                rotas:[{rota, cor, taxa, fila, leve, id, grupo}]   gotas da nascente até a foz:
                      taxa = gotas por segundo; cada gota leva o próximo item da fila (em ordem);
                      leve = gotejamento discreto (sem registros), que não acende a foz
                fontes:[{x, y, cor, id, grupo}]         nascentes que pulsam
                foz:{x, y, r, cor, aro}                 ondulação na foz (aro: cor fixa do anel; sem ela, a cor da gota)
                janela() -> [topo, base] visível em px do canvas (só isso é desenhado)
                intro (onda de luz de cima para baixo na primeira vez), aoChegar() quando ela chega à foz,
                aoGota(cor, item) quando uma gota (não esmaecida) chega à foz: o aro pulsa na cor dela }
        marca(fn): fn({id, grupo}) -> opacidade de cada rota, traço e nascente
        surto(id, n): solta de uma vez, mais depressa, até n itens da fila daquele rio
     RIO.observa(el, ctl)           liga só com el na tela e a aba visível; devolve desliga()
     RIO.gota(cor, raio, dpr)       sprite pré-renderizado (o brilho custa um drawImage)

   Cores
     RIO.mix(a, b, t), RIO.mistura([[cor,peso],...]) (as águas se misturam), RIO.css(cor, alfa)
     RIO.reduzido: prefers-reduced-motion. Nesse caso liga() desenha um quadro parado.
   ===================================================================== */
window.RIO = (function(){
'use strict';
const PASSO = 3, TAU = Math.PI * 2;
const reduzido = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const lerp = (a, b, t) => a + (b - a) * t;
const suave = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a) => (a == null ? 'rgb(' : 'rgba(') + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + (a == null ? ')' : ',' + a + ')');
function mistura(pares){
  let r = 0, g = 0, b = 0, p = 0;
  pares.forEach(x => { const w = x[1]; if (w > 0){ r += x[0][0] * w; g += x[0][1] * w; b += x[0][2] * w; p += w; } });
  return p ? [r / p, g / p, b / p] : [128, 128, 128];
}
function semente(n){
  let a = (n >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const unit = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };

function curso(pts){
  const n = pts.length, cum = [0];
  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const L = cum[n - 1] || 0, m = Math.max(2, Math.ceil(L / PASSO) + 1);
  const x = [], y = [], s = [];
  let j = 0;
  for (let k = 0; k < m; k++){
    const d = L * k / (m - 1);
    while (j < n - 2 && cum[j + 1] < d) j++;
    const seg = cum[j + 1] - cum[j], t = seg > 0 ? (d - cum[j]) / seg : 0;
    x.push(lerp(pts[j][0], pts[Math.min(n - 1, j + 1)][0], t));
    y.push(lerp(pts[j][1], pts[Math.min(n - 1, j + 1)][1], t));
    s.push(d);
  }
  const nx = [], ny = [];
  for (let k = 0; k < m; k++){
    const a = Math.max(0, k - 1), b = Math.min(m - 1, k + 1);
    const u = unit([x[b] - x[a], y[b] - y[a]]);
    nx.push(-u[1]); ny.push(u[0]);
  }
  return { x, y, s, nx, ny, w: new Array(m).fill(1), c: new Array(m).fill([200, 200, 200]), n: m, L };
}
function bezier(p0, p1, p2, p3, n){
  const out = [];
  for (let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    out.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
              u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
  }
  return out;
}
function meandro(a, b, op){
  op = op || {};
  const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  const ta = unit(op.ta || [b[0] - a[0], b[1] - a[1]]), tb = unit(op.tb || [b[0] - a[0], b[1] - a[1]]);
  const k = d * (op.tensao || 0.42);
  const base = bezier(a, [a[0] + ta[0] * k, a[1] + ta[1] * k], [b[0] - tb[0] * k, b[1] - tb[1] * k], b, Math.max(24, Math.ceil(d / 2)));
  const amp = op.amp || 0, ondas = op.ondas || 2, fase = op.fase || 0, n = base.length - 1;
  if (!amp) return base;
  return base.map((p, i) => {
    const t = i / n, i0 = Math.max(0, i - 1), i1 = Math.min(n, i + 1);
    const tg = unit([base[i1][0] - base[i0][0], base[i1][1] - base[i0][1]]);
    const o = amp * Math.sin(Math.PI * t) * Math.sin(Math.PI * ondas * t + fase);
    return [p[0] - tg[1] * o, p[1] + tg[0] * o];
  });
}
function pinta(c, fn){
  for (let i = 0; i < c.n; i++){ const r = fn(i, c.y[i], c.L ? c.s[i] / c.L : 0); c.w[i] = r[0]; c.c[i] = r[1]; }
  return c;
}
function rota(){
  const r = { x: [], y: [], nx: [], ny: [], w: [], c: [], s: [] };
  for (let a = 0; a < arguments.length; a++){
    const [c, i0, i1] = arguments[a];
    for (let i = i0; i <= i1; i++){
      const k = r.x.length;
      if (k && Math.hypot(c.x[i] - r.x[k - 1], c.y[i] - r.y[k - 1]) < 0.5) continue;
      r.x.push(c.x[i]); r.y.push(c.y[i]); r.nx.push(c.nx[i]); r.ny.push(c.ny[i]); r.w.push(c.w[i]); r.c.push(c.c[i]);
    }
  }
  let acc = 0; r.s.push(0);
  for (let i = 1; i < r.x.length; i++){ acc += Math.hypot(r.x[i] - r.x[i - 1], r.y[i] - r.y[i - 1]); r.s.push(acc); }
  r.L = acc; r.n = r.x.length;
  return r;
}
function primeiro(arr, v){
  let lo = 0, hi = arr.length - 1;
  if (arr[hi] < v) return hi;
  while (lo < hi){ const m = (lo + hi) >> 1; if (arr[m] >= v) hi = m; else lo = m + 1; }
  return lo;
}

/* ---- leito: três passes (halo, corpo, reflexo), segmentos agrupados por largura e cor ---- */
function leito(ctx, lista, op){
  const F = op.fundo || [5, 8, 5];
  const passes = [
    { lw: w => w * 2 + 7, cor: (c, f) => mix(F, c, 0.13 * (1 - f)) },
    { lw: w => w, cor: (c, f) => mix(F, c, 0.58 * (1 - 0.9 * f)) },
    { lw: w => Math.max(0.6, w * 0.24), cor: (c, f) => mix(mix(F, c, 0.95 * (1 - 0.9 * f)), [255, 255, 255], 0.12 * (1 - f)), desvio: 0.2, corta: true },
  ];
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const foz = op.foz;
  passes.forEach((P, pi) => {
    lista.forEach(item => {
      const c = item.curso, f = item.fosco || 0;
      let fim = c.n - 1;
      if (P.corta) fim = Math.max(1, fim - Math.ceil((c.w[fim] * 0.7 + 3) / PASSO));
      const dv = P.desvio || 0;
      let chave = null;
      for (let i = 0; i < fim; i++){
        const lw = Math.round(P.lw((c.w[i] + c.w[i + 1]) / 2) * 4) / 4;
        const cs = css(P.cor(c.c[i], f));
        const k = lw + cs;
        if (k !== chave){
          if (chave !== null) ctx.stroke();
          ctx.beginPath(); ctx.lineWidth = lw; ctx.strokeStyle = cs;
          ctx.moveTo(c.x[i] + c.nx[i] * c.w[i] * dv, c.y[i] + c.ny[i] * c.w[i] * dv);
          chave = k;
        }
        ctx.lineTo(c.x[i + 1] + c.nx[i + 1] * c.w[i + 1] * dv, c.y[i + 1] + c.ny[i + 1] * c.w[i + 1] * dv);
      }
      if (chave !== null) ctx.stroke();
    });
    if (foz){
      const f = foz.fosco || 0;
      ctx.beginPath();
      if (pi === 0){ ctx.fillStyle = css(mix(F, foz.cor, 0.13 * (1 - f))); ctx.arc(foz.x, foz.y, foz.r + 24, 0, TAU); ctx.fill(); }
      if (pi === 1){ ctx.fillStyle = css(mix(F, foz.cor, 0.5 * (1 - 0.8 * f))); ctx.arc(foz.x, foz.y, foz.r + 10, 0, TAU); ctx.fill(); }
      if (pi === 2){ ctx.strokeStyle = css(mix(F, foz.aro || foz.cor, 0.9 * (1 - 0.8 * f))); ctx.lineWidth = 1.2; ctx.arc(foz.x, foz.y, foz.r + 10, 0, TAU); ctx.stroke(); }
    }
  });
}
function traco(ctx, r, cor, lw){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [[lw * 4, 0.2], [lw, 0.95]].forEach(p => {
    ctx.beginPath(); ctx.moveTo(r.x[0], r.y[0]);
    for (let i = 1; i < r.n; i++) ctx.lineTo(r.x[i], r.y[i]);
    ctx.strokeStyle = css(cor, p[1]); ctx.lineWidth = p[0]; ctx.stroke();
  });
}
function setas(ctx, c, cor, cada){
  ctx.strokeStyle = cor; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (let s = cada / 2; s < c.L - cada / 3; s += cada){
    const i = primeiro(c.s, s), tx = c.ny[i], ty = -c.nx[i], x = c.x[i], y = c.y[i];
    ctx.beginPath();
    ctx.moveTo(x - tx * 3 + c.nx[i] * 4, y - ty * 3 + c.ny[i] * 4);
    ctx.lineTo(x + tx * 2, y + ty * 2);
    ctx.lineTo(x - tx * 3 - c.nx[i] * 4, y - ty * 3 - c.ny[i] * 4);
    ctx.stroke();
  }
}
function gota(cor, raio, dpr){
  const R = raio * 2.4, S = Math.max(4, Math.ceil(R * 2 * dpr));
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), m = S / 2;
  const grd = g.createRadialGradient(m, m, 0, m, m, m);
  const claro = mix(cor, [255, 255, 255], 0.55);
  grd.addColorStop(0, css(claro, 1)); grd.addColorStop(0.2, css(claro, 0.95));
  grd.addColorStop(0.34, css(cor, 0.55)); grd.addColorStop(0.62, css(cor, 0.13)); grd.addColorStop(1, css(cor, 0));
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  return { img: cv, r: R };
}

/* ---- correnteza: o que se mexe a cada quadro ---- */
function correnteza(cv, cena){
  const ctx = cv.getContext('2d');
  const W = cena.W, H = cena.H, dpr = cena.dpr || 1;
  const rnd = semente(cena.semente || 11);
  const vel = cena.vel || 55;
  const sprites = {};
  const sprite = (cor, k) => { const c = cor.join(',') + '/' + k; return sprites[c] || (sprites[c] = gota(cor, (cena.raio || 2.6) * k, dpr)); };
  /* esp: distância (px) entre duas gotas seguidas = velocidade / gotas por segundo */
  const rotas = (cena.rotas || []).map(r => Object.assign({}, r, { esp: vel / Math.max(0.01, r.taxa || 0.05), alfa: 1,
    sp: sprite(r.cor, r.leve ? 0.62 : 1), fila: r.fila || [], idx: 0, acc: 0 }));
  const fontes = (cena.fontes || []).map(f => Object.assign({}, f, { alfa: 1 }));
  const F = cena.foz ? Object.assign({ alfa: 1 }, cena.foz) : null;

  /* traços da correnteza: tracejado que anda no sentido do fluxo; junto à margem anda mais devagar */
  const tracos = [];
  (cena.cursos || []).forEach(item => {
    const c = item.curso; let wm = 0, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < c.n; i++){ if (c.w[i] > wm) wm = c.w[i]; if (c.y[i] < y0) y0 = c.y[i]; if (c.y[i] > y1) y1 = c.y[i]; }
    const linha = f => { const p = new Path2D(); for (let i = 0; i < c.n; i++){ const o = f * c.w[i]; const x = c.x[i] + c.nx[i] * o, y = c.y[i] + c.ny[i] * o; if (i) p.lineTo(x, y); else p.moveTo(x, y); } return p; };
    const base = { id: item.id, grupo: item.grupo, y0: y0 - 12, y1: y1 + 12, alfa: 1 };
    if (wm < 5) tracos.push(Object.assign({ path: linha(0), dash: [2, 12], lw: 0.9, fase: rnd() * 14, vf: 1 }, base));
    else if (wm < 11){
      tracos.push(Object.assign({ path: linha(-0.1), dash: [3, 15], lw: 1.1, fase: rnd() * 18, vf: 1 }, base));
      tracos.push(Object.assign({ path: linha(0.24), dash: [2, 21], lw: 0.9, fase: rnd() * 23, vf: 0.85 }, base));
    } else [-0.3, 0, 0.27].forEach((f, j) => tracos.push(Object.assign({ path: linha(f), dash: [4 + j, 17 + j * 4], lw: 1.2, fase: rnd() * 25, vf: 1 - Math.abs(f) * 0.6 }, base)));
  });

  /* gotas: cada uma leva um item da fila do seu rio, na ordem (a mais adiantada é a mais antiga).
     Já em regime (espalhadas pela rota) para o rio nascer correndo. */
  const gotas = [];
  const poe = g => { const r = rotas[g.ri].rota; while (g.i < r.n - 2 && r.s[g.i + 1] < g.s) g.i++; };
  function nova(ri, s, item, rapido){
    const r = rotas[ri];
    if (item === undefined) item = r.fila.length ? r.fila[r.idx++ % r.fila.length] : null;
    const g = { ri, s, i: 0, u: (rnd() * 2 - 1) * 0.6, v: (0.92 + rnd() * 0.16) * (rapido || 1), viva: true, item, extra: !!rapido };
    poe(g); gotas.push(g);
  }
  rotas.forEach((r, ri) => {
    const off = r.esp * rnd(), ss = [];
    for (let s = off; s < r.rota.L; s += r.esp) ss.push(s);
    ss.reverse().forEach(s => nova(ri, s));
    r.acc = off;                                   /* distância andada desde a última gota solta */
  });

  /* a foz: o aro acende com o que chega e solta um pulso na cor da gota */
  const aro = { brilho: 0, cor: F ? F.cor : [255, 176, 46], pulsos: [], ult: -9 };
  function chega(g){
    const r = rotas[g.ri];
    if (r.leve || r.alfa < 0.9 || !F) return;
    const ca = F.aro || r.cor;                     /* foz.aro: cor fixa do aro (neutra: o aro é dele) */
    aro.brilho = Math.min(1, aro.brilho + 0.14); aro.cor = ca;
    if (t - aro.ult > 0.22){ aro.ult = t; aro.pulsos.push({ t0: t, cor: ca }); if (cena.aoGota) cena.aoGota(r.cor, g.item); }
  }

  function atualiza(dt){
    let morta = false;
    for (const g of gotas){
      g.s += vel * g.v * dt;
      if (g.s >= rotas[g.ri].rota.L){ g.viva = false; morta = true; chega(g); } else if (g.s > 0) poe(g);
    }
    rotas.forEach((r, ri) => { r.acc += vel * dt; while (r.acc >= r.esp){ r.acc -= r.esp; nova(ri, r.acc); } });
    if (morta){ let j = 0; for (const g of gotas) if (g.viva) gotas[j++] = g; gotas.length = j; }
    aro.brilho *= Math.exp(-dt / 0.5);
    if (aro.pulsos.length) aro.pulsos = aro.pulsos.filter(p => t - p.t0 < 0.9);
  }

  /* abertura: uma onda de luz desce das nascentes até a foz uma vez (nada fica escondido
     se ela não terminar: o leito e as gotas já estão lá) */
  const DUR = 3;
  let t = 0, tIntro = 0, prev = [0, H], revelado = !cena.intro, chegou = !cena.intro;
  const frente = () => revelado ? null : (H + 160) * (1 - Math.pow(1 - Math.min(1, tIntro / DUR), 2)) - 80;

  function desenha(tudo){
    let a = 0, b = H;
    if (!tudo && cena.janela){ const j = cena.janela(); a = Math.max(0, j[0]); b = Math.min(H, j[1]); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c0 = Math.max(0, Math.min(a, prev[0])), c1 = Math.min(H, Math.max(b, prev[1]));
    if (c1 > c0) ctx.clearRect(0, c0, W, c1 - c0);
    prev = [a, b];
    const fr = frente();
    if (fr !== null){
      if (!chegou && F && fr >= F.y){ chegou = true; if (cena.aoChegar) cena.aoChegar(); }
      if (tIntro >= DUR) revelado = true;
    }
    const bb = b;
    if (bb <= a) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, a, W, bb - a); ctx.clip();

    ctx.lineCap = 'butt'; ctx.strokeStyle = 'rgba(232,255,236,.26)';
    for (const tr of tracos){
      if (tr.y1 < a || tr.y0 > bb || tr.alfa < 0.03) continue;
      ctx.globalAlpha = tr.alfa; ctx.lineWidth = tr.lw; ctx.setLineDash(tr.dash);
      ctx.lineDashOffset = -(t * vel * tr.vf + tr.fase);
      ctx.stroke(tr.path);
    }
    ctx.setLineDash([]);

    ctx.lineWidth = 1;
    fontes.forEach((f, k) => {
      if (f.y < a - 14 || f.y > bb + 14) return;
      const ph = (t / 3.2 + k * 0.173) % 1;
      ctx.globalAlpha = 0.6 * (1 - ph) * f.alfa; ctx.strokeStyle = css(f.cor);
      ctx.beginPath(); ctx.arc(f.x, f.y, 2.6 + ph * 7.5, 0, TAU); ctx.stroke();
    });

    const fimR = F ? F.r * 0.9 : 20;
    for (const g of gotas){
      const r = rotas[g.ri], ro = r.rota, i = g.i, s0 = ro.s[i], s1 = ro.s[i + 1];
      const f = s1 > s0 ? Math.min(1, Math.max(0, (g.s - s0) / (s1 - s0))) : 0;
      const o = g.u * ro.w[i] * 0.5;
      const x = ro.x[i] + (ro.x[i + 1] - ro.x[i]) * f + ro.nx[i] * o;
      const y = ro.y[i] + (ro.y[i + 1] - ro.y[i]) * f + ro.ny[i] * o;
      if (y < a - 10 || y > bb + 10) continue;
      let al = r.alfa * Math.min(1, g.s / 16) * Math.min(1, (ro.L - g.s) / fimR) * (r.leve ? 0.5 : 1);
      if (fr !== null && y > fr + 40) al *= 0.4;          /* abaixo da onda, as gotas ainda estão fracas */
      if (al <= 0.02) continue;
      ctx.globalAlpha = al;
      ctx.drawImage(r.sp.img, x - r.sp.r, y - r.sp.r, r.sp.r * 2, r.sp.r * 2);
      if (fr !== null){
        const k = Math.exp(-Math.pow((y - fr) / 60, 2));
        if (k > 0.05){ const q = r.sp.r * (1 + 1.4 * k); ctx.globalAlpha = al * k * 0.8; ctx.drawImage(r.sp.img, x - q, y - q, q * 2, q * 2); }
      }
    }

    if (F && F.y + F.r * 2.3 > a && F.y - F.r * 2.3 < bb){

  }
  bandas.forEach((b, k) => {
    if (sobre){ const cabeW = cx - offDe(k) - M - 6; b.ls = b.itens.map(e => partes(e.rotulo || e.nome, cabeW, pesoDe(e))); }
    b.hs = b.itens.map((e, i) => rowH + (sobre ? (b.ls[i].length - 1) * lh : 0));
  });
  function arranja(l2){
    const colY = { e: topo, d: topo }, pos = [];
    let Jant = 0;
    bandas.forEach((b, k) => {
      const lado = k === 0 ? 'e' : k === 1 ? 'd' : k === 2 ? l2 : k === 3 ? (l2 === 'e' ? 'd' : 'e') : (colY.e <= colY.d ? 'e' : 'd');
      const alt = b.hs.reduce((a, h) => a + h, 0);
      let ini = colY[lado] + hdrH;
      if (k >= 2) ini = Math.max(ini, Jant + minSep - drop - alt);   /* cada faixa chega abaixo da anterior */
      const p = { k, lado, dir: lado === 'e' ? 1 : -1, hdrY: ini - hdrH, ini, fim: ini + alt, J: ini + alt + drop };
      colY[lado] = p.fim + gapB;
      if (k === 1){ p.J = pos[0].J = Math.max(pos[0].fim, p.fim) + drop; }
      pos.push(p); Jant = p.J;
    });
    return pos;
  }
  const opcoes = [arranja('e'), arranja('d')];
  const altura = pos => Math.max.apply(null, pos.map(p => p.J));
  const melhor = altura(opcoes[0]) <= altura(opcoes[1]) ? opcoes[0] : opcoes[1];
  bandas.forEach((b, k) => Object.assign(b, melhor[k]));
  const yC1 = bandas[0].J;                       /* onde nasce o rio principal */
  const yUlt = Math.max.apply(null, bandas.map(b => b.J));
  const yM = yUlt + (mob ? 190 : 185);           /* a foz */
  const H = Math.round(yM + R + (mob ? 74 : 80));
  /* nitidez com teto: DPR até 1,75 e no máximo ~5 Mpx por canvas */
  const dpr = Math.max(1, Math.min(1.75, window.devicePixelRatio || 1, Math.sqrt(4.98e6 / (W * H))));

  /* 2. nomes e nascentes */
  bandas.forEach(b => {
    /* celular: o nome fica sobre o próprio afluente, que nasce na margem e corre por baixo dele
       (sobra largura para a água); tela larga: o nome vem antes da nascente */
    let topoL = b.ini;
    b.linhas = b.itens.map((e, i) => {
      const h = b.hs[i], top = topoL, y = top + h / 2; topoL += h;
      if (sobre) return { e, y, top, h, sy: top + h - 13, ty: top + 15, ls: b.ls[i], px, sx: b.lado === 'e' ? M + 2 : W - M - 2 };
      const ls = quebra(e.rotulo || e.nome, pesoDe(e)), tw = Math.max.apply(null, ls.map(t => mede(t, 0, pesoDe(e))));
      return { e, y, top, h, sy: y, ty: y, ls, tw, sx: b.lado === 'e' ? M + tw + 7 : W - M - tw - 7 };
    });
    const off = offDe(b.k);
    const minT = mob ? 22 : 50;
    const sxs = b.linhas.map(L => L.sx);
    if (sobre) b.xb = cx - b.dir * off;
    else b.xb = b.lado === 'e' ? Math.max(cx - off, Math.max.apply(null, sxs) + minT) : Math.min(cx + off, Math.min.apply(null, sxs) - minT);
    b.a = mob ? 2.5 : 8; b.lam = mob ? 120 : 180; b.fase = b.k * 1.9 + 0.4;
    b.Q = b.linhas.reduce((a, L) => a + vazao(L.e), 0);
    b.wMax = larg(b.Q);
    b.y0 = b.linhas[0].sy + dJ;
    b.cor = RIO.mistura(b.linhas.map(L => [RGB[L.e.gravidade], vazao(L.e)]));
  });
  const bx = (b, y) => b.xb + b.a * Math.sin(TAU * (y - b.y0) / b.lam + b.fase);

  /* 3. rio principal: x(y) da nascença até a foz, desviando dos rios que correm ao lado */
  const nM = Math.max(3, Math.ceil((yM - yC1) / 2) + 1);
  const mx = [], lo = [], hi = [];
  const Amid = mob ? 22 : 46, Alow = mob ? Math.min(W * 0.15, 60) : Math.min(W * 0.1, 110), lamM = mob ? 280 : 360;
  /* a última curva: depois do último encontro o rio se desvia para o lado oposto e volta ao centro na foz */
  const ultima = bandas[bandas.length - 1], ladoCurva = ultima.lado === 'd' ? -1 : 1;
  const c0 = yUlt + 6, c1 = yM - R - 26;
  const meia = larg(Qtot) / 2;
  for (let i = 0; i < nM; i++){
    const y = yC1 + (yM - yC1) * i / (nM - 1);
    const A = lerp(Amid, Alow, suave((y - yUlt) / 70));
    const env = suave((y - yC1) / 80) * suave((yM - R - 20 - y) / 110);
    const meio = cx + A * env * Math.sin(TAU * (y - yC1) / lamM + 0.9);
    const curva = cx + ladoCurva * Alow * Math.sin(Math.PI * Math.max(0, Math.min(1, (y - c0) / (c1 - c0))));
    mx.push(lerp(meio, curva, suave((y - yUlt) / 50)));
    let l = M + 40, h = W - M - 40;
    bandas.forEach(b => {
      if (b.k < 2 || y < b.ini - 8 || y > b.fim + 10) return;
      const folga = b.a + b.wMax / 2 + meia + (mob ? 5 : 14);
      if (b.lado === 'e') l = Math.max(l, b.xb + folga); else h = Math.min(h, b.xb - folga);
    });
    lo.push(l); hi.push(h);
  }
  const aperta = () => { for (let i = 0; i < nM; i++) mx[i] = lo[i] > hi[i] ? (lo[i] + hi[i]) / 2 : Math.min(hi[i], Math.max(lo[i], mx[i])); };
  aperta();
  for (let p = 0; p < 3; p++){
    const cp = mx.slice(), r = 14;
    for (let i = 0; i < nM; i++){ let s = 0, n = 0; for (let j = Math.max(0, i - r); j <= Math.min(nM - 1, i + r); j++){ s += cp[j]; n++; } mx[i] = s / n; }
    aperta();
  }
  for (let i = 0; i < nM; i++) mx[i] = lerp(cx, mx[i], Math.min(suave(i / 20), suave((nM - 1 - i) / 20)));
  const mainX = y => { const f = (y - yC1) / (yM - yC1) * (nM - 1), i = Math.max(0, Math.min(nM - 2, Math.floor(f))); return lerp(mx[i], mx[i + 1], Math.max(0, Math.min(1, f - i))); };
  const ptsM = []; for (let y = yC1; y < yM; y += 3) ptsM.push([mainX(y), y]); ptsM.push([cx, yM]);
  const main = RIO.curso(ptsM);
  RIO.pinta(main, (i, y) => {
    const pares = bandas.map(b => [b.cor, b.Q * (b.k < 2 ? 1 : suave((y - b.J + 2) / 18))]);
    const Q = pares.reduce((a, p) => a + p[1], 0);
    return [larg(Q) * (1 + 0.9 * suave((y - (yM - R - 56)) / 56)), RIO.mistura(pares)];
  });
  const corFoz = RIO.mistura(bandas.map(b => [b.cor, b.Q]));

  /* 4. rios das faixas: descem pela margem e fazem a curva até o principal */
  bandas.forEach(b => {
    const pts = [];
    for (let y = b.y0; y < b.fim; y += 3) pts.push([bx(b, y), y]);
    const x1 = bx(b, b.fim), xJ = mainX(b.J), sg = x1 > xJ ? 1 : -1;
    pts.push([x1, b.fim]);
    const curva = RIO.bezier([x1, b.fim], [x1, b.fim + (b.J - b.fim) * 0.5], [xJ + sg * Math.min(10, Math.abs(x1 - xJ) * 0.35), b.J - (b.J - b.fim) * 0.42], [xJ, b.J], 24);
    b.curso = RIO.curso(pts.concat(curva.slice(1)));
    const jun = b.linhas.map((L, j) => ({ y: L.sy + dJ, q: vazao(L.e), cor: RGB[L.e.gravidade], j }));
    RIO.pinta(b.curso, (i, y) => {
      const pares = jun.map(J => [J.cor, J.q * (J.j === 0 ? 1 : suave((y - J.y + 3) / 14))]);
      return [larg(pares.reduce((a, p) => a + p[1], 0)), RIO.mistura(pares)];
    });
  });

  /* 5. afluentes: da nascente, serpenteando, até o rio da faixa */
  const tribs = [];
  bandas.forEach(b => b.linhas.forEach(L => {
    const yj = L.sy + dJ, xj = bx(b, yj), d = Math.hypot(xj - L.sx, yj - L.sy);
    const pts = RIO.meandro([L.sx, L.sy], [xj, yj], {
      amp: Math.min((rowH - 12) / 2, sobre ? 3.6 : 11, d * 0.12), ondas: Math.max(1, Math.round(d / (sobre ? 34 : 55))),
      fase: hash(L.e.id) * Math.PI, ta: [b.dir, 0.12], tb: [b.dir * 0.5, 1]
    });
    const c = RIO.curso(pts), q = vazao(L.e), wq = larg(q), cor = RGB[L.e.gravidade];
    RIO.pinta(c, (i, y, t) => [wMin + (wq - wMin) * Math.pow(t, 0.6), cor]);
    const rota = RIO.rota([c, 0, c.n - 1], [b.curso, RIO.primeiro(b.curso.y, yj), b.curso.n - 1], [main, RIO.primeiro(main.y, b.J), main.n - 1]);
    tribs.push({ e: L.e, b, sx: L.sx, sy: L.sy, curso: c, rota, cor });
  }));

  /* 6. DOM: camadas, nomes, foz */
  const leito = $('#bacia-leito'), agua = $('#bacia-agua');
  box.style.height = H + 'px';
  [leito, agua].forEach(cv => { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; });
  let html = '';
  bandas.forEach(b => {
    html += '<div class="bh" style="' + (b.lado === 'e' ? 'left' : 'right') + ':' + M + 'px;top:' + b.hdrY + 'px;line-height:' + hdrH + 'px"><i>// </i>' + esc(FAIXAS[b.f].nome.toUpperCase()) + ' · ' + b.itens.length + '</div>';
    b.linhas.forEach(L => {
      const m0 = Math.max(0, M - 8);
      const left = b.lado === 'e' ? m0 : Math.round(b.xb + 4);
      const width = b.lado === 'e' ? Math.round(b.xb - 4 - m0) : Math.round(W - m0 - left);
      const rot = L.e.rotulo || L.e.nome;
      const nomeA = (rot === L.e.nome ? rot : rot + ', ' + L.e.nome) + '. Ver o caminho até ele.';
      html += '<button type="button" class="rt ' + b.lado + (L.e.id === MARIELLE ? ' forte' : '') + '" data-id="' + esc(L.e.id) + '" aria-label="' + esc(nomeA) + '" style="left:' + left + 'px;top:' + Math.round(L.top) + 'px;width:' + width + 'px;height:' + L.h + 'px;' +
        (b.lado === 'e' ? 'padding:0 0 0 ' + (M - m0) + 'px;' : 'padding:0 ' + (M - m0) + 'px 0 0;') +
        (sobre ? 'align-items:flex-start;padding-top:' + Math.round(L.ty - lh / 2 - L.top) + 'px;' : '') +
        'font-size:' + (L.px || px) + 'px;line-height:' + lh + 'px;color:' + NOME_COR + '"><span>' + L.ls.map(esc).join('<br>') + '</span></button>';
    });
  });
  html += '<div class="foz-b" id="foz-b" style="left:' + (cx - R) + 'px;top:' + (yM - R) + 'px;width:' + (2 * R) + 'px;height:' + (2 * R) + 'px">' + '<span>FB</span></div>' +
          '<div class="foz-n" style="left:' + cx + 'px;top:' + (yM + R + 14) + 'px"><b>FLÁVIO BOLSONARO</b><span>candidato à Presidência</span></div>';
  $('#bacia-rot').innerHTML = html;
  poeFoto(document.getElementById('foz-b'));
  document.querySelectorAll('#bacia-rot .rt').forEach(x => {
    x.addEventListener('click', () => toca(x.dataset.id));
    const entra = () => { if (!$('#folha').classList.contains('on')) realca(x.dataset.id); };
    const sai = () => { if (!$('#folha').classList.contains('on')) realca(null); };
    x.addEventListener('mouseenter', entra); x.addEventListener('focus', entra);
    x.addEventListener('mouseleave', sai); x.addEventListener('blur', sai);
  });

  const intro = !introFeita && !reduzido;
  introFeita = true;


  B = { W, H, dpr, mob, R, cx, yM, bandas, tribs, main, leito, agua, corFoz, destaque: null, ctl: null, solta: () => {} };
  pintaLeito();
  B.ctl = RIO.correnteza(agua, {
    W, H, dpr, vel: mob ? 48 : 60, raio: mob ? 2.4 : 2.8, semente: 7,
    cursos: tribs.map(t => ({ curso: t.curso, id: t.e.id, grupo: t.e.faixa }))
      .concat(bandas.map(b => ({ curso: b.curso, grupo: b.f })))
      .concat([{ curso: main, grupo: 'principal' }]),
    /* uma gota por registro, na ordem das datas; sem registros, um gotejar lento e discreto */
    rotas: tribs.map(t => ({ rota: t.rota, cor: t.cor, fila: t.e.fila, leve: !t.e.fila.length,
      taxa: t.e.fila.length ? t.e.fila.length / CICLO : 1 / 16, id: t.e.id, grupo: t.e.faixa })),
    fontes: tribs.map(t => ({ x: t.sx, y: t.sy, cor: t.cor, id: t.e.id, grupo: t.e.faixa })),
    foz: { x: cx, y: yM, r: R, cor: corFoz, aro: ARO },
    janela: () => { const r = box.getBoundingClientRect(); return [-r.top - 40, window.innerHeight - r.top + 40]; },
    intro,
    aoChegar: () => { const f = document.getElementById('foz-b'); if (f) f.classList.add('pulso'); },
    aoGota: cor => aroPulsa(cor)
  });
  marca();
  B.solta = RIO.observa(box, B.ctl);
}

/* realce e filtro: repinta a camada parada e ajusta a opacidade das gotas */
function pintaLeito(){
  if (!B) return;
  const ctx = B.leito.getContext('2d');
  ctx.setTransform(B.dpr, 0, 0, B.dpr, 0, 0);
  ctx.clearRect(0, 0, B.W, B.H);
  const d = B.destaque, fd = d ? faixaDe(d) : null;
  const fT = e => d ? (e.id === d ? 0 : 1) : (filtro && e.faixa !== filtro ? 0.8 : 0);
  const fB = b => d ? (b.f === fd ? 0.3 : 1) : (filtro && b.f !== filtro ? 0.8 : 0);
  const fM = d ? 0.35 : 0;
  const lista = B.tribs.map(t => ({ curso: t.curso, fosco: fT(t.e) }))
    .concat(B.bandas.map(b => ({ curso: b.curso, fosco: fB(b) })))
    .concat([{ curso: B.main, fosco: fM }]);
  RIO.leito(ctx, lista, { fundo: FUNDO, foz: { x: B.cx, y: B.yM, r: B.R, cor: B.corFoz, aro: ARO, fosco: fM } });
  B.tribs.forEach(t => {
    ctx.globalAlpha = 1 - fT(t.e) * 0.85; ctx.fillStyle = RIO.css(t.cor);
    ctx.beginPath(); ctx.arc(t.sx, t.sy, B.mob ? 2.3 : 2.7, 0, TAU); ctx.fill();
  });
  ctx.globalAlpha = 1;
  if (d){ const t = B.tribs.find(z => z.e.id === d); if (t) RIO.traco(ctx, t.rota, t.cor, B.mob ? 1.8 : 2.2); }
  if (reduzido) RIO.setas(ctx, B.main, 'rgba(232,255,236,.5)', B.mob ? 90 : 110);
  document.querySelectorAll('#bacia-rot .rt').forEach(x => {
    const e = TODOS.find(z => z.id === x.dataset.id);
    x.classList.toggle('dim', !!(d ? x.dataset.id !== d : (filtro && e && e.faixa !== filtro)));
  });
  marca();
}
function marca(){
  if (!B || !B.ctl) return;
  const d = B.destaque, fd = d ? faixaDe(d) : null;
  B.ctl.marca(x => {
    if (d){ if (x.id === d) return 1; if (x.id == null) return (x.grupo === 'principal' || x.grupo === fd) ? 0.45 : 0.1; return 0.1; }
    if (filtro) return (x.grupo === filtro || x.grupo === 'principal') ? 1 : 0.14;
    return 1;
  });
}
function realca(id){
  if (B && B.destaque !== id){ B.destaque = id; pintaLeito(); }
  document.querySelectorAll('#rio-svg .lane').forEach(x => x.classList.toggle('dim', !!id && x.dataset.id !== id));
}
/* tocar num caso na bacia: o rio dele acende, os outros esmaecem, sai um surto de gotas
   (os registros dele) e a ficha sobe logo depois */
let tocaT = 0;
function toca(id){
  clearTimeout(tocaT);
  realca(id);
  if (reduzido){ abre(id); return; }
  if (B && B.ctl) B.ctl.surto(id, 40);
  tocaT = setTimeout(() => abre(id), 400);
}
/* o aro da foto pisca quando uma gota chega; sempre em cor neutra (nada dele em vermelho ou âmbar) */
let aroT = 0;
function aroPulsa(){
  const f = document.getElementById('foz-b'); if (!f) return;
  f.style.borderColor = '#ffffff';
  clearTimeout(aroT); aroT = setTimeout(() => { f.style.borderColor = ''; }, 260);
}

/* ---------- o rio para rolar ---------- */
function rio(){
  const box = $('#rio'), svg = $('#rio-svg'), col = $('#trechos');
  const W = Math.round(box.clientWidth);
  const M = 6, Tmax = Math.round(Math.min(W * (W < 600 ? 0.22 : 0.19), 150)), gap = 22;
  col.style.marginLeft = (M + Tmax + gap) + 'px';
  const lista = [];
  let html = '';
  ORDEM_RIO.forEach(f => {
    if (filtro && f !== filtro) return;
    const itens = ordena(TODOS.filter(e => e.faixa === f)).reverse();   /* o mais grave entra por último, mais perto da foz */
    if (!itens.length) return;
    html += '<div class="trecho-h">' + esc(FAIXAS[f].nome) + ' <span>· ' + itens.length + '</span></div>';
    itens.forEach(e => {
      lista.push(e);
      const ele = eleDe(e);
      html += '<button type="button" class="afl" id="afl-' + esc(e.id) + '" data-id="' + esc(e.id) + '">' +
        '<span class="n">' + esc(e.rotulo || e.nome) + '</span>' +
        (numeroDe(e) ? '<span class="an"><b' + (e.numero.cor === 'tinta' ? ' style="color:var(--tinta)"' : '') + (ehFrase(e.numero) ? ' class="frase">' + esc(e.numero.valor) : '>' + numHtml(e.numero.valor)) + '</b><span class="t">' + esc(fraseDe(e)) + '</span></span>' : '<span class="via">' + esc(fraseDe(e)) + '</span>') +
        /* a situação dele só quando é formal; cor neutra (a cor da gravidade é de quem está no caminho) */
        (ele ? '<span class="sf">' + esc(ele.replace(/\.$/, '')) + '</span>' : '') +
        '</button>';
    });
  });
  col.innerHTML = html;
  col.querySelectorAll('.afl').forEach(b => b.addEventListener('click', () => abre(b.dataset.id)));

  /* geometria medida do que foi desenhado */
  const ws = larguras(lista, Tmax);
  const xsCard = M + Tmax + gap - 4;
  const topo = box.getBoundingClientRect().top;
  let off = 0, fimCards = 0;
  const lanes = lista.map((e, k) => {
    const c = document.getElementById('afl-' + e.id).getBoundingClientRect();
    const ys = c.top - topo + 16, yj = ys + 30;
    const w = ws[k], xl = M + off + w / 2; off += w;
    fimCards = Math.max(fimCards, c.bottom - topo);
    return { e, w, xl, ys, yj };
  });
  const yEnd = fimCards + 24, yFoz = yEnd + 150, xf = W / 2;
  const alto = yFoz + 150;
  box.style.height = alto + 'px';
  svg.setAttribute('width', W); svg.setAttribute('height', alto); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + alto);
  svg.innerHTML = '';
  const centro = M + off / 2;
  lanes.forEach(l => {
    const ofs = (l.xl - centro) * 0.3;
    const d = 'M' + xsCard + ',' + l.ys.toFixed(1) +
      ' C' + (l.xl + (xsCard - l.xl) * 0.35).toFixed(1) + ',' + l.ys.toFixed(1) + ' ' + l.xl.toFixed(1) + ',' + (l.ys + 8).toFixed(1) + ' ' + l.xl.toFixed(1) + ',' + l.yj.toFixed(1) +
      ' L' + l.xl.toFixed(1) + ',' + yEnd.toFixed(1) +
      ' C' + l.xl.toFixed(1) + ',' + (yEnd + 70).toFixed(1) + ' ' + (xf + ofs).toFixed(1) + ',' + (yFoz - 90).toFixed(1) + ' ' + (xf + ofs).toFixed(1) + ',' + (yFoz - 20).toFixed(1);
    const p = el('path', { d, class: 'lane' + (reduzido ? '' : ' anim'), stroke: COR[l.e.gravidade], 'stroke-width': l.w.toFixed(2), 'data-id': l.e.id, pathLength: 1 });
    svg.appendChild(p);
  });
  /* a foz, em HTML para a foto */
  let foz = document.getElementById('foz-rio');
  if (!foz){ foz = document.createElement('div'); foz.id = 'foz-rio'; foz.className = 'foz'; box.appendChild(foz); }
  foz.style.left = xf + 'px'; foz.style.top = (yFoz - 30) + 'px';
  foz.innerHTML = '<div class="disco">' + (fotoFlavio ? '<img alt="" src="' + esc(fotoFlavio) + '">' : 'FB') + '</div><b>FLÁVIO BOLSONARO</b><span>candidato à Presidência</span>';

  /* o rio se enche conforme se rola */
  if (!reduzido && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(ents => ents.forEach(en => {
      if (!en.isIntersecting) return;
      const p = svg.querySelector('.lane[data-id="' + en.target.dataset.id + '"]'); if (p) p.classList.add('on');
      io.unobserve(en.target);
    }), { rootMargin: '0px 0px -25% 0px' });
    col.querySelectorAll('.afl').forEach(b => io.observe(b));
  } else {
    svg.querySelectorAll('.lane').forEach(p => p.classList.add('on'));
  }
}

/* ---------- ficha do afluente ---------- */
function irPara(id){
  const b = document.getElementById('afl-' + id);
  if (!b){ filtro = null; cabecalho(); pintaLeito(); rio(); return irPara(id); }
  b.scrollIntoView({ behavior: reduzido ? 'auto' : 'smooth', block: 'center' });
  b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 1600);
  const p = document.querySelector('#rio-svg .lane[data-id="' + id + '"]'); if (p) p.classList.add('on');
}
/* mesma regra de assets/historia.js: vermelho só para prisão ou condenação válida; prisão anulada,
   revogada ou com denúncia arquivada deixa de ser vermelha; negações ("não", "nunca", "sem",
   "nenhum", "ninguém") não contam; "processado" conta como investigado */
function statusCls(s){
  s = String(s || '').toLowerCase().replace(/(?:^|[^\wÀ-ú])(n[ãa]o|nunca|sem|nenhum|ningu[ée]m)\s+(\S+\s+){0,2}?(pres[oa]s?|condena\S*|condenad\S*|indiciad\S*|indiciamento\S*|investigad\S*|denunciad\S*|den[úu]ncia\S*|r[ée]u|processad\S*)\b/g, ' ');
  const desfeito = /\banul(ou|ad[oa]s?)\b|revogou a (ordem de )?pris|pris[ãa]o (foi )?revogad|\bsolt[oa]s?\b|\barquivad[oa]s?\b/.test(s);
  if (/\bcondenad[oa]s?\b/.test(s) && !/condena\S*\s+(foi\s+)?anulad/.test(s)) return 'grave';
  if (/\bpres[oa]s?\b/.test(s)) return desfeito ? (/\barquivad/.test(s) ? '' : 'medio') : 'grave';
  if (/(investigad|denunciad|\br[ée]u\b|\balvo\b|indiciad|processad)/.test(s)) return /\barquivad/.test(s) && !/(investigad|\br[ée]u\b|indiciad|processad)/.test(s) ? '' : 'medio';
  return '';
}
function url(){ return location.origin + location.pathname; }
/* situação curta de um nome no caminho: a 1ª oração e, se houver, o desfecho (anulada, arquivada,
   sem condenação...), para nunca mostrar "preso" ou "denunciado" sem o que veio depois */
const DESF_FORTE = /anul|arquiv|sem condena|nunca|n[ãa]o (foi )?(denunciad|indiciad|condenad|julgad)|sem den[úu]ncia|absolv|\bsolt|improcedente|morto|morreu/i;
const DESF = /revog|foragid|responde em liberdade/i;
function curtoSt(s){
  const cl = String(s || '').replace(/\s*\([^)]*\)/g, '').split(/;\s+|\.\s+(?=[A-ZÁÉÍÓÚ])/).map(x => x.trim().replace(/\.$/, '')).filter(Boolean);
  if (!cl.length) return '';
  const tem = re => re.test(cl[0]);
  let extra = null;
  if (!tem(DESF_FORTE)) extra = cl.slice(1).find(x => DESF_FORTE.test(x)) || (tem(DESF) ? null : cl.slice(1).find(x => DESF.test(x)));
  const min = x => /^[A-ZÁÉÍÓÚ][a-zà-ú]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x;
  /* "as provas foram anuladas, a denúncia foi arquivada em 2022 e ninguém foi condenado" -> "denúncia anulada" */
  if (extra && /provas\b.*anulad.*den[úu]ncia\b.*arquivad/i.test(extra)) extra = 'denúncia anulada';
  return cl[0] + (extra ? '; ' + min(extra) : '');
}
/* a versão dele no caso (frases do status em que ele diz, nega, admite); sem as negativas de investigação */
function versaoDele(e){
  return String(e.status_flavio || '').split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚ])/)
    .filter(x => /\b(diz|disse|afirma|afirmou|nega|negou|admite|acusa|chamou|respond|comentar)/i.test(x))
    .filter(x => /^(Flávio|Ele|Diz|Disse|Admite|Sobre|A assessoria|O gabinete|A defesa|Em nota|Procurado|À Folha|Foi ouvido)/.test(x))
    .filter(x => !/investigad|n[ãa]o é (alvo|parte|citad)/i.test(x))
    .join(' ');
}
function abre(id){
  const e = TODOS.find(z => z.id === id); if (!e) return;
  const c = e.cadeia || [];
  const mari = e.id === MARIELLE;
  /* "na teia": cada nome da cadeia que também está na teia (de_id/para_id), uma vez só */
  const vistos = new Set(['flavio']);
  const roda = l => [l.de_id, l.para_id].filter(id => id && NO[id] && !vistos.has(id) && vistos.add(id))
    .map(id => '<a class="roda" href="drive.html?p=' + encodeURIComponent(id) + '#rede">' + esc(NO[id].nome) + ' na teia →</a>').join('');
  /* a nascente (o caso, não uma pessoa: sem de_id e sem elo que chegue nela) fica neutra, como na história */
  const nasc = l => !l.de_id && !c.some(x => String(x.para).trim() === String(l.de).trim());
  /* a cadeia enxuta: quem → quem e a situação em poucas palavras; relação, fonte e teia em "ler mais" */
  const passos = c.map(l => {
    /* "sem processo" não se diz, de ninguém (como na história): basta não dizer que é */
    const dele = /^Flávio Bolsonaro$/.test(String(l.de).trim());
    const sd = String(l.status_de || '').split(/;\s*/).filter(x => !/^sem processo\b/i.test(x.trim())).join('; ');
    const st = curtoSt(sd), stl = String(sd || '').trim().replace(/\.$/, '');
    return '<li class="' + (dele || nasc(l) ? '' : statusCls(l.status_de)) + '"><span class="de">' + esc(l.de) + '</span> → ' + esc(l.para) +
      (st ? '<span class="stt' + (stl && stl !== st ? ' cu' : '') + '">' + esc(st) + '</span>' : '') +
      (stl && stl !== st ? '<span class="stt mx">' + esc(stl) + '</span>' : '') +
      '<span class="rel">' + esc(l.relacao) + '</span>' +
      (l.fonte && l.fonte.url ? '<a class="ft" href="' + esc(l.fonte.url) + '" target="_blank" rel="noopener">' + esc(l.fonte.veiculo || 'fonte') + (l.fonte.data ? ' · ' + esc(dataBR(l.fonte.data)) : '') + ' ↗</a>' : '') +
      roda(l) + '</li>';
  }).join('');
  const cadeia = '<div class="kicker">O caminho</div><ol class="cam">' + passos + '<li class="fim"><span class="de">Flávio Bolsonaro</span></li></ol>';
  const fontes = (e.fontes || []).filter(f => /^https?:\/\//.test(f.url || '')).map(f => '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.veiculo) + (f.data ? ' (' + esc(dataBR(f.data)) + ')' : '') + '</a>').join(' · ');
  const ver = versaoDele(e);
  $('#folha-cx').innerHTML =
    '<button type="button" class="fx" id="fx">fechar ✕</button>' +
    '<div class="kicker">' + esc(FAIXAS[e.faixa].nome) + '</div>' +
    '<h3>' + esc(e.rotulo || e.nome) + '</h3>' +
    blocoNumero(e) +
    '<div class="acoes"><button type="button" class="env" data-share="' + esc(e.id) + '">enviar ↗</button>' +
    (AFLUENTE[e.id] ? '<a class="sec afl-dh" href="' + esc(AFLUENTE[e.id][0]) + '">' + esc(AFLUENTE[e.id][1]) + '</a>' : '') +
    (e.registros ? '<a class="sec" href="drive.html?q=' + encodeURIComponent(e.q || e.busca || e.rotulo) + '#arquivo">' + e.registros + (e.registros === 1 ? ' registro' : ' registros') + '</a>' : '') +
    (mari ? '<a class="sec" href="drive.html?caminho=marielle#rede">na teia</a>' : '') + '</div>' +
    (mari ? ligacoesMarielle(e) + '<div class="cam-mari">' + cadeia + '</div>' : cadeia) +
    '<button type="button" class="lm" id="lm" aria-expanded="false">ler mais ↓</button>' +
    '<div class="mais-box">' +
      '<p class="op">' + esc([e.operacao, e.periodo].filter(Boolean).join(' · ')) + '</p>' +
      '<p class="res">' + esc(e.resumo) + '</p>' +
      (ver ? '<p class="ver"><b>A versão dele.</b> ' + esc(ver) + '</p>' : '') +
      (fontes ? '<p class="fonte">Fontes: ' + fontes + '</p>' : '') +
    '</div>';
  $('#folha').classList.add('on');
  $('#folha-cx').classList.remove('aberta');
  $('#folha-cx').scrollTop = 0;       /* a ficha nova abre do topo, mesmo que a anterior tenha sido rolada */
  try { history.replaceState(null, '', '#' + id); } catch(_){}
  $('#fx').addEventListener('click', fecha);
  $('#lm').addEventListener('click', () => {
    const cx = $('#folha-cx'), ab = cx.classList.toggle('aberta');
    $('#lm').textContent = ab ? 'ler menos ↑' : 'ler mais ↓'; $('#lm').setAttribute('aria-expanded', String(ab));
  });
  ligaEnvio($('#folha-cx'));
  realca(id);
  cabeFrase($('#folha-cx .nb-n.frase'));
  conta(document.getElementById('nb-conta'));
}
/* destaque-frase em no máximo 2 linhas e sem palavra saindo da caixa: se não couber, a letra desce de 2 em 2px */
function cabeFrase(el){
  if (!el) return;
  el.style.fontSize = '';
  const cs = getComputedStyle(el);
  let fs = parseFloat(cs.fontSize);
  const lh = (parseFloat(cs.lineHeight) || fs * 1.04) / fs;
  for (let k = 0; k < 14 && fs > 22 && (el.getBoundingClientRect().height > fs * lh * 2.3 || el.scrollWidth > el.clientWidth + 1); k++){
    fs -= 2; el.style.fontSize = fs + 'px';
  }
}
function ligacoesMarielle(e){
  const elo = id => (e.cadeia || []).find(l => l.de_id === id && l.fonte && l.fonte.url);
  return '<div class="kicker lig-k">As duas ligações</div><ul class="lig">' + MARIELLE_LIGA.map(x => {
    const l = elo(x.id), f = l ? l.fonte : null;
    return '<li><b>' + esc(x.quem) + '</b><span class="pena">' + esc(x.pena) + '</span><span class="lg">' + esc(x.liga) + '</span>' +
      (f ? '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.veiculo || 'fonte') + (f.data ? ' · ' + esc(dataBR(f.data)) : '') + ' ↗</a>' : '') + '</li>';
  }).join('') + '</ul>';
}
function blocoNumero(e){
  const n = numeroDe(e), ele = eleDe(e);
  const linhaEle = ele ? '<p class="ele-l"><b>ELE</b>' + esc(ele) + '</p>' : '';
  if (!n) return '<div class="nb"><p class="nb-t">' + esc(fraseDe(e)) + '</p>' + linhaEle + '</div>';
  const f = n.fonte || {}, ok = /^https?:\/\//.test(f.url || '');
  const rot = esc(f.veiculo || 'fonte') + (f.data ? ', ' + esc(dataBR(f.data)) : '');
  /* número que é a situação dele (ele entre os investigados): na cor do texto, nunca em âmbar.
     Destaque-frase: sem contagem, letra de manchete menor, até 2 linhas (cabeFrase) */
  return '<div class="nb"><p class="nb-n' + (ehFrase(n) ? ' frase' : '') + '"' + (n.cor === 'tinta' ? ' style="color:var(--tinta)"' : '') + '>' +
    (ehFrase(n) ? esc(n.valor) : numHtml(n.valor, 'nb-conta')) + '</p>' +
    '<p class="nb-t">' + esc(fraseDe(e)) + '</p>' + linhaEle +
    (f.veiculo || ok ? '<p class="nb-f">' + (ok ? '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + rot + ' ↗</a>' : rot) + '</p>' : '') + '</div>';
}
function fecha(){ if (contaRaf){ cancelAnimationFrame(contaRaf); contaRaf = 0; } $('#folha').classList.remove('on'); realca(null); try { history.replaceState(null, '', location.pathname); } catch(_){} }
$('#folha').addEventListener('click', ev => { if (ev.target === $('#folha')) fecha(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') fecha(); });
ligaEnvio(document);

/* ---------- foto da foz (Wikipédia, licença livre) ---------- */
let fotoFlavio = null;
function poeFoto(box){   /* a foto cobre as iniciais; se não carregar, ficam as iniciais */
  if (!box || !fotoFlavio || box.querySelector('img')) return;
  const im = new Image(); im.alt = ''; im.addEventListener('error', () => im.remove()); im.src = fotoFlavio; box.appendChild(im);
}
(async function(){
  let cache = {}; try { cache = JSON.parse(localStorage.getItem('af_fotos_v1')) || {}; } catch(_){}
  fotoFlavio = cache['Flávio Bolsonaro'] || null;
  if (!fotoFlavio){
    try {
      const d = await fetch('https://pt.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=200&redirects=1&origin=*&titles=' + encodeURIComponent('Flávio Bolsonaro')).then(r => r.json());
      const p = Object.values(d.query.pages)[0]; fotoFlavio = (p.thumbnail || {}).source || null;
      if (fotoFlavio){ cache['Flávio Bolsonaro'] = fotoFlavio; try { localStorage.setItem('af_fotos_v1', JSON.stringify(cache)); } catch(_){} }
    } catch(_){}
  }
  if (fotoFlavio){
    poeFoto(document.getElementById('foz-b'));
    const f = document.querySelector('#foz-rio .disco'); if (f) f.innerHTML = '<img alt="" src="' + esc(fotoFlavio) + '">';
  }
})();

/* ---------- depois da foz: os números saem dos dados ---------- */
if ((D.itens || []).length) $('#fr-arq').textContent = 'Todos os ' + D.itens.length + ' registros →';
document.addEventListener('DOMContentLoaded', () => {     /* as perguntas do quiz chegam com defer */
  const nq = (window.__QUIZ_BASICO || []).length + (window.__NOVAS_PERGUNTAS || []).length;
  if (nq) $('#fr-quiz').textContent = 'O quiz: ' + nq + ' perguntas →';
});

/* ---------- arranque ---------- */
cabecalho(); destaque(); bacia(); rio();
function doHash(){
  const h0 = decodeURIComponent((location.hash || '').slice(1));
  const h = TODOS.some(e => e.id === h0) ? h0 : ((FOZ.redireciona || {})[h0] || '');   /* rio fundido a outro continua abrindo */
  return TODOS.some(e => e.id === h) ? h : '';
}
const h = doHash();
if (h) setTimeout(() => { irPara(h); abre(h); }, 300);
/* link foz.html#<id> clicado com a Foz já aberta (a ficha usa replaceState, então isto não é voltar/avançar) */
window.addEventListener('hashchange', () => { const k = doHash(); if (k){ irPara(k); abre(k); } });
/* só refaz com mudança de largura: no celular a barra de endereço muda a altura ao rolar */
let rt, larguraAnt = $('#bacia').clientWidth;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  const w = $('#bacia').clientWidth; if (w === larguraAnt) return; larguraAnt = w; bacia(); rio();
}, 150); });
})();
</script>
