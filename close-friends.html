<style>
/* A rede em órbita (X08, S12, Onda 1): o placar da situação no alto, a órbita, e a ficha da pessoa como destaque (.dq).
   Anel = a situação literal da pessoa (tokens de data/dados.js, a mesma conta do index e dos cartões):
   vermelho = preso ou condenado · âmbar = investigado ou denunciado · verde = outros · ele em tinta (neutro). */

/* placar: um número e a barra dos 3 status, que é também a legenda dos anéis */
.placar{margin:2px 0 16px}
.pl-top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
/* integrador (CLS a 1,6 Mbps): o placar é preenchido depois do dados-lite + grafo; o espaço fica reservado */
#pl-n:empty{min-height:clamp(44px, 13vw + 2px, 72px)} #pl-t:empty{min-height:45px} #pl-leg:empty{min-height:39px}
@media (min-width:600px){ #pl-leg:empty{min-height:17px} } @media (min-width:900px){ #pl-t:empty{min-height:48px} }
.pl-top .numero{margin:0}
.pl-top .numero .u{font-size:.5em}
.pl-t{margin:6px 0 10px; font-size:16px; line-height:1.4; max-width:30em}
.pl-barra{display:flex; gap:2px; height:8px; margin:0 0 4px; border-radius:2px; overflow:hidden}
.pl-barra i{display:block; min-width:4px}
.pl-barra .grave{background:var(--st-grave)} .pl-barra .medio{background:var(--st-medio)} .pl-barra .outros{background:var(--st-outros)}
.placar .legenda{margin:6px 0 0}
.placar .legenda b{font-weight:700; color:var(--tinta); font-variant-numeric:tabular-nums}

/* busca */
.busca{display:flex; gap:8px; margin:14px 0 10px}
.busca input{flex:1; font:inherit; font-size:16px; padding:10px 12px; min-height:44px; border:1px solid var(--linha); border-radius:2px; background:var(--leve); color:var(--tinta); min-width:0}
.busca input:focus{outline:none; border-color:var(--tinta)}

/* caminho percorrido */
.migalhas{font-family:var(--mono); font-size:12px; color:var(--cinza); margin:8px 0 6px; min-height:18px; display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.migalhas button{font-family:var(--mono); font-size:12px; background:none; border:0; padding:6px 0; color:var(--azul); text-decoration:underline; text-underline-offset:2px; cursor:pointer}
.migalhas b{color:var(--tinta); font-weight:700}

/* órbita */
.orbita{position:relative; width:100%; aspect-ratio:1/1.1; margin:4px auto 0; user-select:none; -webkit-user-select:none; overflow:visible}
.orbita svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.orbita line{stroke:var(--linha); stroke-width:1.5; transition:stroke .25s, stroke-width .25s}
.orbita line.teia{stroke:var(--linha); stroke-width:1; stroke-dasharray:3 4}
.orbita line.fio{stroke:var(--linha); stroke-width:1; opacity:.8}

.no{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:96px; text-align:center; cursor:pointer; opacity:1;
  display:flex; flex-direction:column; align-items:center;
  transition:left .45s cubic-bezier(.2,.7,.2,1), top .45s cubic-bezier(.2,.7,.2,1), opacity .3s;
  -webkit-tap-highlight-color:transparent;
}
.no:focus-visible{outline:none}
.no:focus-visible .disco{box-shadow:0 0 0 3px var(--papel), 0 0 0 5px var(--amber)}
.no.some{opacity:0; pointer-events:none}
.no .disco{
  width:56px; height:56px; border-radius:50%; margin:0 0 5px; background:var(--leve);
  display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;
  font-weight:700; font-size:20px; letter-spacing:-.01em; color:var(--tinta); border:2px solid var(--st-outros);
  transition:box-shadow .2s;
}
.no .disco img{width:100%; height:100%; object-fit:cover; display:block}
.no.medio .disco{border:2.5px solid var(--st-medio)}
.no.grave .disco{border:3px solid var(--st-grave)}
.no.ele .disco{border:2.5px solid var(--tinta)}
.no.centro .disco{width:84px; height:84px; font-size:26px}
.no.centro{width:120px; cursor:default}
.no .nome{font-size:12px; line-height:1.15; color:var(--tinta); font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-shadow:0 0 4px var(--papel), 0 0 8px var(--papel)}
.no.centro .nome{font-size:14px; font-weight:700}
.no.veio .nome::after{content:" ↩"; color:var(--cinza)}
/* satélites: o 2º grau atrás de cada pessoa, sem nome — só a situação */
div.sat{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:1; transition:left .45s cubic-bezier(.2,.7,.2,1), top .45s cubic-bezier(.2,.7,.2,1), opacity .3s; -webkit-tap-highlight-color:transparent}
div.sat.some{opacity:0; pointer-events:none}
.sat i{display:block; width:11px; height:11px; border-radius:50%; background:var(--leve); border:1.5px solid var(--st-outros)}
.sat.medio i{border:2px solid var(--st-medio)}
.sat.grave i{border:2px solid var(--st-grave)}
.sat.ele i{border:2px solid var(--tinta)}

.mais{display:block; margin:18px auto 0; font-family:var(--mono); font-size:12px; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--linha); background:var(--papel); color:var(--tinta); cursor:pointer}
.mais[hidden]{display:none}

/* a ficha da pessoa: o destaque (.dq) da página */
.ficha{margin:8px 0 0}
.ficha .papel{color:var(--cinza); font-size:14px; line-height:1.4; margin:0 0 10px}
.ficha .chip{margin:0 0 10px}
.ficha .caso{margin:6px 0 12px; padding:10px 0 2px; border-top:1px solid var(--linha)}
.ficha .caso .kicker{margin:0 0 4px}
.ficha .caso .numero.destaque{font-size:clamp(40px,12vw,64px)}
.ficha .caso .numero.frase{font-size:clamp(26px,7.4vw,38px); margin:0 0 6px}
.ficha .caso .dq-t{margin:6px 0 4px}
.vinculo{margin:0 0 12px; padding:10px 0 0; border-top:1px solid var(--linha)}
.vinculo .rot{font-family:var(--mono); font-size:11px; color:var(--cinza); letter-spacing:.06em; margin-bottom:4px; text-transform:uppercase}
.vinculo p{margin:0 0 4px; font-size:15px; line-height:1.45}
.ficha .sit{font-size:14px; line-height:1.45; color:var(--cinza); margin:0 0 10px}
.sit-m{border:0; background:none; padding:6px 2px; min-height:32px; color:var(--amber); font:600 13px var(--sans); cursor:pointer}
.dica{color:var(--cinza); font-size:14px; line-height:1.45; margin:4px 0 8px}
.ficha .dq-a{margin-top:4px}
.ficha .dq-a > a.sec{min-height:44px; color:var(--tinta); font-size:14px; font-weight:600}
.vinculo p.fonte{font-size:12px; margin:2px 0 0}
.credito{font-family:var(--mono); font-size:11px; color:var(--cinza); margin:10px 0 0}
.credito a{color:var(--azul)}

/* lista "mais" */
.folha{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:60}
.folha.on{display:block}
.folha .cx{position:absolute; left:0; right:0; bottom:0; max-height:78vh; overflow:auto; overscroll-behavior:contain; border-top:1px solid var(--linha); background:var(--papel); padding:14px 16px 30px; border-radius:14px 14px 0 0}
.folha h3{margin:0 0 8px; font-size:15px}
.folha .it{display:flex; gap:10px; align-items:center; width:100%; padding:9px 0; border:0; border-bottom:1px solid var(--linha); background:none; color:var(--tinta); font:inherit; text-align:left; cursor:pointer}
.folha .it .d{width:36px; height:36px; border-radius:50%; background:var(--leve); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--tinta); overflow:hidden; border:2px solid var(--st-outros)}
.folha .it .d img{width:100%;height:100%;object-fit:cover}
.folha .it.grave .d{border:2.5px solid var(--st-grave)} .folha .it.medio .d{border:2.5px solid var(--st-medio)} .folha .it.ele .d{border:2.5px solid var(--tinta)}
.folha .it b{display:block; font-size:14px}
.folha .it span{font-size:12px; color:var(--cinza); display:block}

/* créditos das fotos (licenças livres; a atribuição que a licença pede) */
.creditos{margin:26px 0 0; font-size:12px; color:var(--cinza)}
.creditos summary{font-family:var(--mono); font-size:12px; cursor:pointer; min-height:44px; display:flex; align-items:center}
.creditos ul{list-style:none; margin:0; padding:0; font-family:var(--mono); font-size:11px; line-height:1.6}
.creditos a{color:var(--azul)}
@media (min-width:900px){ .pl-t{font-size:17px} }
</style>

<script>
(function(){
  const D = window.DOSSIE;
  const N = {}; D.grafo.nodes.forEach(n => N[n.id] = n);
  const ADJ = {};
  D.grafo.edges.forEach(e => { (ADJ[e.de] = ADJ[e.de] || []).push(e); (ADJ[e.para] = ADJ[e.para] || []).push(e); });
  const ITENS = {};
  (D.itens || []).forEach(i => (i.pessoas || []).forEach(p => { (ITENS[p] = ITENS[p] || []).push(i); }));

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- situação: três estados, pelos tokens do arquivo (a conta do index e dos cartões) ----------
     grave = condenado, ou preso (menos prisão anulada, segundo a cadeia da Foz); medio = investigado ou denunciado;
     outros = o resto (denúncia anulada, morte, nenhum processo). Ele fica fora: situação em cor neutra. */
  let ANUL = new Set();
  function sit(n){
    if (!n) return 'outros';
    if (n.id === 'flavio') return 'ele';
    const s = n.situacao || [];
    if (s.includes('condenado') || (s.includes('preso') && !ANUL.has(n.id))) return 'grave';
    if (s.includes('investigado') || s.includes('denunciado')) return 'medio';
    return 'outros';
  }
  const ROTULO = { grave:'PRESO OU CONDENADO', medio:'INVESTIGADO OU DENUNCIADO' };
  const anoMorte = n => ((String(n.status || '').match(/\bmort[oa]\b[^.;]*?\b((?:19|20)\d\d)\b/i) || [])[1] || '');
  const rotulo = n => {
    const s = sit(n);
    if (ROTULO[s]) return ROTULO[s];
    if ((n.situacao || []).includes('morto')) return 'MORTO' + (anoMorte(n) ? ' EM ' + anoMorte(n) : '');
    if ((n.situacao || []).includes('arquivada')) return 'DENÚNCIA ANULADA';
    return '';                                             // sem situação: sem selo
  };
  const SIT_FLAVIO = 'Rachadinha: denúncia anulada. Caso Master: investigado no STF, sem denúncia.';
  const frases = st => String(st || '').split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚ])/);
  /* a situação de cada um: a 1ª frase; o resto em "mais" */
  function sitCurta(st, sf){
    const fr = frases(st), resto = fr.slice(1).join(' ');
    return '<p class="sit">' + esc(fr[0]) + (resto ? '<span class="sit-r" hidden> ' + esc(resto) + '</span> <button type="button" class="sit-m">mais</button>' : '') + sf + '</p>';
  }

  function vizinhos(id){
    const seen = new Set(), out = [];
    (ADJ[id] || []).forEach(e => { const o = e.de === id ? e.para : e.de; if (N[o] && !seen.has(o)) { seen.add(o); out.push({ id:o, e }); } });
    return out;
  }
  function arestaEntre(a, b){
    return (ADJ[a] || []).find(e => (e.de === a && e.para === b) || (e.de === b && e.para === a));
  }
  function gravidade(id){
    const s = sit(N[id]); return (s === 'grave' ? 30 : s === 'medio' ? 20 : 0) + Math.min(10, (ADJ[id] || []).length);
  }
  const porGravidade = (a, b) => gravidade(b.id) - gravidade(a.id) || a.id.localeCompare(b.id);

  // "Ronald Paulo de Alves Pereira" -> "Ronald Pereira"; apelido entre parênteses vence.
  function curto(nome){
    const ap = nome.match(/\(([^)]+)\)/); if (ap) return ap[1].replace(/^['"]|['"]$/g, '');
    const p = nome.replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(w => !/^(de|da|do|dos|das|e)$/i.test(w));
    if (p.length <= 2) return p.join(' ');
    if (/^(instituto|banco|bolsotini|jmartelo|goup)/i.test(p[0])) return p.slice(0, 3).join(' ');
    return p[0] + ' ' + p[p.length - 1];
  }
  function iniciais(nome){
    const p = nome.replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(w => w.length > 2 && !/^(de|da|do|dos|das|e)$/i.test(w));
    return ((p[0] || '')[0] || '') + ((p[p.length - 1] || '')[0] || '');
  }

  /* ---------- o placar: os nomes ligados diretamente a ele, pela situação ---------- */
  const DIRETOS = vizinhos('flavio').map(x => x.id).filter(id => id !== 'flavio');
  function placar(){
    const c = { grave:0, medio:0, outros:0 };
    DIRETOS.forEach(id => { c[sit(N[id])]++; });
    const n = DIRETOS.length;
    $('#pl-n').innerHTML = c.grave + '<span class="u"> de </span>' + n;
    $('#pl-n').setAttribute('aria-label', c.grave + ' de ' + n);
    $('#pl-t').textContent = 'nomes em volta dele foram presos ou condenados. Cada nome com a fonte.';
    $('#pl-barra').innerHTML = ['grave', 'medio', 'outros'].map(k => c[k] ? '<i class="' + k + '" style="flex:' + c[k] + '"></i>' : '').join('');
    $('#pl-leg').innerHTML = '<span><i class="anel grave"></i><b>' + c.grave + '</b> presos ou condenados</span>' +
      '<span><i class="anel medio"></i><b>' + c.medio + '</b> investigados ou denunciados</span>' +
      '<span><i class="anel outros"></i><b>' + c.outros + '</b> outros</span>';
  }

  /* ---------- a Foz (data/foz.js, carregado depois): o caso em que cada nome aparece ---------- */
  let CASOS = {}, ESC = {};
  const GRAV = { preso_ou_condenado_na_cadeia:3, investigado_na_cadeia:2, sem_processo_na_cadeia:1 };
  function lerFoz(){
    const F = window.FOZ; if (!F || !F.escandalos) return false;
    const PA = /anul\S*\s+(?:a\s+)?(?:ordem de\s+)?pris|pris[ãa]o\s+(?:foi\s+)?anulad/i, T = window.BD_TOPICOS || {};
    ANUL = new Set(); CASOS = {}; ESC = {};
    F.escandalos.forEach(e => {
      ESC[e.id] = e;
      const conta = {};
      (e.cadeia || []).forEach(l => {
        if (l.de_id && PA.test(l.status_de || '')) ANUL.add(l.de_id);
        [l.de_id, l.para_id].forEach(id => { if (id && id !== 'flavio') conta[id] = (conta[id] || 0) + 1; });
      });
      Object.keys(conta).forEach(id => {
        /* o caso que mais fala dela: mais elos; o caso com o nome dela no id; o mais grave */
        const ch = id.split(/[-_]/)[0], nota = conta[id] * 10 + (ch.length > 3 && e.id.indexOf(ch) >= 0 ? 15 : 0) + (GRAV[e.gravidade] || 0);
        if (T[e.id] && (!CASOS[id] || nota > CASOS[id].nota)) CASOS[id] = { id: e.id, nota };
      });
    });
    return true;
  }
  const casoDe = id => (CASOS[id] && ESC[CASOS[id].id]) || null;
  /* na Foz "ele" é sempre Flávio; na ficha de outra pessoa o pronome ficaria ambíguo: o texto do caso diz o nome */
  const explicita = t => String(t).replace(/\bdele\b/g, 'de Flávio').replace(/\bnele\b/g, 'em Flávio').replace(/\bEle\b/g, 'Flávio').replace(/\bele\b/g, 'Flávio');
  const dataBR = d => /^\d{4}-\d{2}-\d{2}/.test(d || '') ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
  /* número da Foz: "R$ 131 milhões" → R$ pequeno + 131 + " milhões" pequeno; frase-choque em .numero.frase */
  function numeroHTML(nm){
    const v = String(nm.valor || '');
    if (nm.tipo === 'frase' || !/\d/.test(v)) return '<p class="numero frase">' + esc(v) + '</p>';
    const m = /^(\D*?)(\d[\d.,]*)(.*)$/.exec(v);
    if (!m) return '<p class="numero destaque">' + esc(v) + '</p>';
    return '<p class="numero destaque">' + (m[1] ? '<span class="p">' + esc(m[1]) + '</span>' : '') + esc(m[2]) + (m[3] ? '<span class="u">' + esc(m[3]) + '</span>' : '') + '</p>';
  }

  /* ---------- fotos: retratos locais (assets/fotos.js, licença livre); sem eles, as iniciais ---------- */
  const FOTO = window.BD_FOTOS || {}, CRED = window.BD_FOTOS_CREDITO || {};
  function pintaDisco(disco, id){
    if (FOTO[id]){ if (!disco.querySelector('img')) disco.innerHTML = '<img alt="" src="' + esc(FOTO[id]) + '" loading="lazy" decoding="async">'; }
    else if (!disco.textContent) disco.textContent = iniciais(N[id].nome);
  }
  function creditos(){
    const ids = Object.keys(FOTO).filter(id => N[id] && CRED[id]);
    if (!ids.length) return;
    $('#creditos-l').innerHTML = ids.map(id => { const c = CRED[id];
      return '<li>' + esc(N[id].nome) + ': ' + esc(c.autor || '') + ' · <a href="' + esc(c.pagina || c.licenca_url || '#') + '" target="_blank" rel="noopener">' + esc(c.licenca || 'licença') + '</a></li>'; }).join('');
    $('#creditos').hidden = false;
  }

  /* ---------- estado ---------- */
  let centro = 'flavio', caminho = ['flavio'], trilha = null, passo = 0;
  const orb = $('#orbita'), svg = $('#linhas'), elMais = $('#mais');
  const nos = new Map();      // id -> div
  const R1 = 36, R2 = 48;     // raios do anel e dos satélites, em % da largura
  const ALT = 1.10;           // a órbita é um pouco mais alta que larga (rótulos de baixo)

  function capacidade(){ return orb.clientWidth < 480 ? 8 : 10; }
  const SATS = 3;             // satélites por pessoa do anel

  function anel(){
    const v = vizinhos(centro).sort(porGravidade);
    const cap = capacidade();
    const anterior = caminho.length > 1 ? caminho[caminho.length - 2] : null;
    let mostra = v.slice(0, cap);
    if (anterior && !mostra.some(x => x.id === anterior)){       // o caminho de volta fica visível
      const ant = v.find(x => x.id === anterior);
      if (ant) mostra = mostra.slice(0, cap - 1).concat([ant]);
    }
    return { mostra, resto: v.filter(x => !mostra.includes(x)) };
  }
  // ângulo do i-ésimo de n, começando no topo
  const ang = (i, n) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  // posição em % (x na largura, y na altura, que é ALT vezes a largura)
  function pos(a, r){ return { x: 50 + r * Math.cos(a), y: 50 + (r * Math.sin(a)) / ALT }; }

  function criaNo(id){
    const n = N[id], el = document.createElement('div');
    el.className = 'no some ' + sit(n); el.dataset.id = id;
    el.setAttribute('role', 'button'); el.tabIndex = 0; el.setAttribute('aria-label', n.nome);
    el.innerHTML = '<div class="disco"></div><div class="nome">' + esc(curto(n.nome)) + '</div>';
    pintaDisco(el.querySelector('.disco'), id);
    el.addEventListener('click', () => toque(id));
    el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); toque(id); } });
    orb.appendChild(el); nos.set(id, el);
    return el;
  }
  function coloca(el, p, classes, tipo){
    el.className = (tipo || 'no') + ' ' + classes;
    void el.offsetWidth;                                   // a transição precisa ver o estado anterior
    el.style.left = p.x + '%'; el.style.top = p.y + '%';
  }
  const sats = new Map();     // id -> div (satélite)
  function criaSat(id, via){
    const el = document.createElement('div');
    el.className = 'sat some ' + sit(N[id]); el.dataset.id = id; el.title = N[id].nome;
    el.innerHTML = '<i></i>';
    el.addEventListener('click', () => explorarVia(via, id));
    orb.appendChild(el); sats.set(id, el);
    return el;
  }

  function render(){
    const { mostra, resto } = anel();
    const anterior = caminho.length > 1 ? caminho[caminho.length - 2] : null;
    const idx = {}; mostra.forEach((x, i) => idx[x.id] = i);
    const vivos = new Set([centro, ...mostra.map(x => x.id)]);
    const P = id => { const p = pos(ang(idx[id], mostra.length), R1); return { x: p.x * 10, y: p.y * 11 }; };

    // satélites: até 3 conexões de cada pessoa do anel que ainda não estão na tela
    const satsNovos = [];
    mostra.forEach((x, i) => {
      const filhos = vizinhos(x.id).filter(y => !vivos.has(y.id)).sort(porGravidade).slice(0, SATS);
      const a0 = ang(i, mostra.length);
      const r2 = Math.sin(a0) > 0.3 ? R2 + 8 : R2;              // embaixo, o rótulo fica entre o disco e os pontinhos
      filhos.forEach((y, j) => { vivos.add(y.id); satsNovos.push({ id:y.id, via:x.id, p: pos(a0 + (j - (filhos.length - 1) / 2) * 0.16, r2), pai: P(x.id) }); });
    });

    // ---- linhas: raios, teia entre vizinhos do anel, fios dos satélites
    const L = [];
    satsNovos.forEach(s => L.push('<line class="fio" x1="' + s.pai.x + '" y1="' + s.pai.y + '" x2="' + (s.p.x * 10) + '" y2="' + (s.p.y * 11) + '"/>'));
    mostra.forEach(x => { const p = P(x.id); L.push('<line x1="500" y1="550" x2="' + p.x + '" y2="' + p.y + '"/>'); });
    for (let i = 0; i < mostra.length; i++) for (let j = i + 1; j < mostra.length; j++){
      const a = mostra[i].id, b = mostra[j].id;
      if (arestaEntre(a, b)){ const pa = P(a), pb = P(b); L.push('<line class="teia" x1="' + pa.x + '" y1="' + pa.y + '" x2="' + pb.x + '" y2="' + pb.y + '"/>'); }
    }
    svg.innerHTML = L.join('');

    // ---- nós: quem já existe desliza; quem chega aparece; quem sai some
    const vivosNos = new Set([centro, ...mostra.map(x => x.id)]);
    nos.forEach((el, id) => { if (!vivosNos.has(id)) { el.classList.add('some'); setTimeout(() => { if (el.classList.contains('some')) { el.remove(); nos.delete(id); } }, 320); } });
    const c = nos.get(centro) || criaNo(centro);
    coloca(c, { x:50, y:50 }, 'centro ' + sit(N[centro]));
    c.tabIndex = -1;
    mostra.forEach((x, i) => {
      const el = nos.get(x.id) || criaNo(x.id);
      el.tabIndex = 0;
      coloca(el, pos(ang(i, mostra.length), R1), sit(N[x.id]) + (x.id === anterior ? ' veio' : ''));
    });
    const vivosSats = new Set(satsNovos.map(s => s.id));
    sats.forEach((el, id) => { if (!vivosSats.has(id)) { el.classList.add('some'); setTimeout(() => { if (el.classList.contains('some')) { el.remove(); sats.delete(id); } }, 320); } });
    satsNovos.forEach(s => {
      const el = sats.get(s.id) || criaSat(s.id, s.via);
      el.onclick = () => explorarVia(s.via, s.id);
      coloca(el, s.p, sit(N[s.id]), 'sat');
    });

    elMais.hidden = !resto.length;
    elMais.textContent = '+ ' + resto.length + ' ' + (resto.length === 1 ? 'ligação' : 'ligações');
    elMais.onclick = () => abreFolha(resto);

    migalhas(); ficha();
  }

  // um toque explora; o vínculo com quem ficou para trás aparece na ficha
  function toque(id){ if (id !== centro) explorar(id); }
  function explorar(id){
    if (!N[id]) return;
    const k = caminho.indexOf(id);
    caminho = k >= 0 ? caminho.slice(0, k + 1) : caminho.concat([id]);
    centro = id; render(); marca();
  }
  function explorarVia(meio, id){
    if (nos.has(id)) { explorar(id); return; }
    caminho = caminho.concat([meio, id]); centro = id; render(); marca();
  }
  /* o endereço acompanha a pessoa no centro (o link enviado cai nela) */
  function marca(){ try { history.replaceState(null, '', centro === 'flavio' ? location.pathname : '#' + centro); } catch (e) {} }

  function migalhas(){
    $('#migalhas').innerHTML = caminho.map((id, i) =>
      i === caminho.length - 1 ? '<b>' + esc(N[id].nome) + '</b>'
                               : '<button type="button" data-ir="' + esc(id) + '">' + esc(curto(N[id].nome)) + '</button><span>›</span>').join('');
    document.querySelectorAll('#migalhas [data-ir]').forEach(b => b.addEventListener('click', () => explorar(b.dataset.ir)));
  }
  function fonteHTML(fontes){
    const f = (fontes || [])[0]; if (!f || !f.url) return '';
    return '<p class="fonte">fonte: <a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.veiculo || 'ver') + '</a></p>';
  }

  /* ---------- a ficha (.dq): nome, situação literal, o caso da Foz com o número, o vínculo, o envio ---------- */
  function ficha(){
    const id = centro, n = N[id], s = sit(n), its = (ITENS[id] || []).length, ele = id === 'flavio';
    const caso = ele ? null : casoDe(id);
    let vinculo = '';
    if (caminho.length > 1){
      const ant = caminho[caminho.length - 2], e = arestaEntre(ant, centro);
      if (e) vinculo = '<div class="vinculo"><div class="rot">como se liga a ' + esc(ant === 'flavio' ? 'Flávio' : N[ant].nome) + '</div><p>' + esc(e.rotulo || '') + '</p>' + fonteHTML(e.fontes) + '</div>';
    }
    const sf = (n.situacao_fontes && n.situacao_fontes[0] && n.situacao_fontes[0].url)
      ? ' <a href="' + esc(n.situacao_fontes[0].url) + '" target="_blank" rel="noopener">[fonte]</a>' : '';
    let casoH = '';
    if (caso && caso.numero){
      const f = caso.numero.fonte || {};
      casoH = '<div class="caso"><p class="kicker neutro">na Foz · ' + esc(caso.rotulo || caso.nome) + '</p>' + numeroHTML(caso.numero) +
        '<p class="dq-t">' + esc(explicita(caso.numero.texto || '')) + '</p>' +
        (f.url ? '<p class="dq-f"><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.veiculo || 'fonte') + (dataBR(f.data) ? ', ' + dataBR(f.data) : '') + ' ↗</a></p>' : '') + '</div>';
    }
    const cr = CRED[id] && FOTO[id] ? '<p class="credito">foto: ' + esc(CRED[id].autor || '') + ' · <a href="' + esc(CRED[id].pagina || CRED[id].licenca_url || '#') + '" target="_blank" rel="noopener">' + esc(CRED[id].licenca || 'licença') + '</a></p>' : '';
    const envio = ele ? '' : '<button type="button" class="env" data-share="' + (caso ? esc(caso.id) : 'quem-anda') + '"' + (caso ? '' : ' data-pessoa="' + esc(id) + '"') + '>enviar ↗</button>';
    $('#ficha').innerHTML =
      '<h2>' + esc(n.nome) + '</h2>' +
      '<p class="papel">' + esc(ele ? 'Senador (PL-RJ), candidato à Presidência' : (n.papel || '')) + '</p>' +
      /* ele: uma linha seca, em cor neutra (nada dele em âmbar ou vermelho) */
      (ele ? '<p class="dq-s">' + esc(SIT_FLAVIO) + '</p><p class="dica">Toque num nome da órbita para abrir a ficha: a situação, a fonte do vínculo e o caso da Foz em que aparece.</p>'
           : (rotulo(n) ? '<div class="chip' + (s === 'grave' ? ' grave' : s === 'outros' ? ' nenhum' : '') + '">' + rotulo(n) + '</div>' : '')) +
      (n.status && !ele ? sitCurta(n.status, sf) : '') +
      casoH + vinculo +
      '<div class="dq-a">' + envio +
        (caso ? '<a href="foz.html#' + encodeURIComponent(caso.id) + '">a ficha do caso →</a>' : '') +
        (its ? '<a class="sec" href="drive.html#arquivo">' + its + (its === 1 ? ' registro' : ' registros') + '</a>' : '') +
      '</div>' + cr;
  }
  $('#ficha').addEventListener('click', ev => {
    const m = ev.target.closest('.sit-m');
    if (m){ m.previousElementSibling.hidden = false; m.remove(); return; }
    const b = ev.target.closest('[data-share]'); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();          // o envio é daqui (texto da pessoa), não da delegação do compartilhar.js
    envia(b.dataset.share, b.dataset.pessoa ? textoPessoa(b.dataset.pessoa) : null);
  });

  /* S12: sem caso na Foz, vai o cartão da teia com o texto da pessoa (literal: o vínculo e a 1ª frase da situação)
     e o link que abre a órbita nela */
  function textoPessoa(id){
    const n = N[id], e = arestaEntre('flavio', id), fr = frases(n.status)[0] || '';
    const quem = '*' + n.nome + '*' + (e && e.rotulo ? ' — ligação com Flávio Bolsonaro: ' + e.rotulo.replace(/\.$/, '') : (n.papel ? ', ' + n.papel.replace(/\.$/, '') : '')) + '.';
    /* a situação vai sempre inteira (a 1ª frase, literal): cortar poderia tirar o "solto", o "anulada" */
    const st = fr ? fr.replace(/\s*$/, '') : (rotulo(n) ? 'Situação: ' + rotulo(n).toLowerCase() + '.' : '');
    const T = (window.BD_TOPICOS || {})['quem-anda'], base = T && T.url ? T.url.replace(/c\/[^/]*$/, '') : location.origin + location.pathname.replace(/[^/]*$/, '');
    return { texto: quem + (st ? '\n' + st : '') + '\nNa teia de nomes em volta de Flávio Bolsonaro, cada nome com a fonte.\nBOLSODRIVE\n',
             url: base + 'close-friends.html#' + encodeURIComponent(id) };
  }
  function envia(topico, extra){
    if (window.BDShare && typeof window.BDShare.enviar === 'function'){ window.BDShare.enviar(topico, extra || undefined); return; }
    const url = extra ? extra.url : location.origin + location.pathname, txt = extra ? extra.texto + url : url;
    if (navigator.share){ navigator.share(extra ? { text: extra.texto, url } : { url }).catch(() => {}); return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
  }
  /* o cabeçalho ("enviar esta tela", assets/nav.js): o caso de quem está no centro, senão a teia */
  window.BD_TELA = () => { const c = centro !== 'flavio' && casoDe(centro); return c ? c.id : 'quem-anda'; };

  /* ---------- "+ N ligações" ---------- */
  function abreFolha(lista){
    $('#folha-cx').innerHTML = '<h3>Todas as ligações de ' + esc(N[centro].nome) + '</h3>' +
      lista.map(x => '<button type="button" class="it ' + sit(N[x.id]) + '" data-id="' + esc(x.id) + '"><span class="d">' + (FOTO[x.id] ? '<img alt="" src="' + esc(FOTO[x.id]) + '" loading="lazy">' : esc(iniciais(N[x.id].nome))) + '</span><span><b>' + esc(N[x.id].nome) + '</b><span>' + esc((x.e.rotulo || '').slice(0, 90)) + '</span></span></button>').join('');
    $('#folha').classList.add('on');
    document.querySelectorAll('#folha-cx .it').forEach(el => el.addEventListener('click', () => { $('#folha').classList.remove('on'); explorar(el.dataset.id); }));
  }
  $('#folha').addEventListener('click', e => { if (e.target === $('#folha')) $('#folha').classList.remove('on'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#folha').classList.remove('on'); });

  /* ---------- busca ---------- */
  const porNome = {};
  const dl = $('#pessoas');
  Object.values(N).sort((a, b) => a.nome.localeCompare(b.nome)).forEach(n => { porNome[n.nome] = n.id; const o = document.createElement('option'); o.value = n.nome; dl.appendChild(o); });
  $('#busca').addEventListener('change', e => {
    const id = porNome[e.target.value]; if (!id) return;
    if (trilha) encerraTrilha();
    caminho = id === 'flavio' ? ['flavio'] : ['flavio', id]; explorar(id); e.target.value = ''; e.target.blur();
    $('#orbita').scrollIntoView({ block:'start', behavior:'smooth' });
  });

  /* ---------- trilhas guiadas ---------- */
  // Cada passo: quem entra no centro e uma frase. As frases seguem o status
  // registrado no arquivo — nada além do que a ficha de cada um já diz.
  const TRILHAS = {
    filme: { nome:'O dinheiro do filme', passos:[
      ['flavio',  'Comece por ele. Em julho de 2026 virou investigado no STF por causa do financiamento de um filme sobre o pai.'],
      ['vorcaro', 'O dono do Banco Master. Áudios divulgados pela imprensa mostram Flávio negociando com ele o dinheiro do filme. Está preso; sem condenação.'],
      ['paulo_henrique', 'Presidia o BRB quando o banco financiou a mansão de Flávio, em 2021. O empréstimo foi julgado regular em 2025; Costa está preso e é investigado no caso Master, sem relação apurada com o financiamento.']
    ]},
    milicia: { nome:'Do gabinete à milícia', passos:[
      ['flavio',  'Comece pelo gabinete dele na Alerj, entre 2003 e 2018.'],
      ['queiroz', 'Ex-assessor, apontado pelo MP-RJ como operador da rachadinha. Foi denunciado; a denúncia foi anulada e ninguém foi condenado.'],
      ['adriano', 'Amigo de Queiroz desde 2003. Flávio propôs para ele a Medalha Tiradentes na Alerj, em 2005; a mãe e a ex-mulher dele foram lotadas no gabinete, segundo o MP-RJ. Apontado pelo MP-RJ como chefe do Escritório do Crime; morto em 09/02/2020 sem ser julgado no caso do Escritório do Crime.']
    ]},
    chapa: { nome:'A chapa de 2026', passos:[
      ['flavio', 'Comece pela campanha presidencial de 2026.'],
      ['marcio-canella', 'Foi pré-candidato ao Senado pelo Rio com "apoio integral" de Flávio até 03/08/2026, quando desistiu. Preso em flagrante com um fuzil em julho de 2026 e solto três dias depois; responde em liberdade e é investigado por lavagem de dinheiro.'],
      ['rogeria-nantes-bolsonaro', 'A 1ª suplente da chapa era a mãe de Flávio, indicada por ele.']
    ]}
  };
  function iniciaTrilha(k){
    trilha = TRILHAS[k]; passo = 0;
    document.querySelectorAll('#trilhas button').forEach(b => b.classList.toggle('on', b.dataset.trilha === k));
    caminho = []; vaiPasso();
  }
  function vaiPasso(){
    const [id, txt] = trilha.passos[passo];
    explorar(id);
    const fim = passo === trilha.passos.length - 1, el = $('#narra'); el.hidden = false;
    el.innerHTML = '<div class="passo">' + esc(trilha.nome.toUpperCase()) + ' · ' + (passo + 1) + ' / ' + trilha.passos.length + '</div><p>' + esc(txt) + '</p>' +
      '<div class="bt">' + (fim ? '' : '<button type="button" id="prox">Próximo →</button>') + '<button type="button" class="sec" id="sair">' + (fim ? 'Encerrar' : 'Sair da trilha') + '</button></div>';
    const p = $('#prox'); if (p) p.addEventListener('click', () => { passo++; vaiPasso(); });
    $('#sair').addEventListener('click', encerraTrilha);
  }
  function encerraTrilha(){
    trilha = null; $('#narra').hidden = true;
    document.querySelectorAll('#trilhas button').forEach(b => b.classList.remove('on'));
    ficha();
  }
  document.querySelectorAll('#trilhas button').forEach(b => b.addEventListener('click', () => iniciaTrilha(b.dataset.trilha)));

  /* ---------- o envio do placar: o tópico da teia (assets/compartilhar.js); sem o módulo, o endereço ---------- */
  $('#placar [data-share]').addEventListener('click', ev => { ev.preventDefault(); ev.stopImmediatePropagation(); envia('quem-anda'); });

  /* ---------- deep link e arranque ---------- */
  const h = decodeURIComponent(location.hash.replace('#', ''));
  if (h && N[h]) { caminho = h === 'flavio' ? ['flavio'] : ['flavio', h]; centro = h; }
  lerFoz();
  placar(); render(); creditos();
  /* data/foz.js chega depois (defer): refaz o placar (prisão anulada) e a ficha (o caso da Foz) */
  if (!window.FOZ) document.addEventListener('DOMContentLoaded', () => { if (lerFoz()){ placar(); ficha(); } });
  // só redesenha quando a largura muda: no celular, a barra de endereço some/volta e dispara resize só de altura
  let rt, lw = window.innerWidth; window.addEventListener('resize', () => { if (window.innerWidth === lw) return; lw = window.innerWidth; clearTimeout(rt); rt = setTimeout(render, 120); });
})();
</script>
