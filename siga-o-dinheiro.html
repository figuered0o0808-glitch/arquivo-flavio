<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siga o dinheiro — BolsoDrive</title>
<meta name="description" content="Os fluxos de dinheiro do arquivo sobre Flávio Bolsonaro, um de cada vez: origem, destino, valor, fonte e status jurídico.">
<link rel="stylesheet" href="assets/base.css?v=4">
<link rel="stylesheet" href="assets/header.css?v=14">
<link rel="icon" type="image/svg+xml" href="assets/marca/favicon.svg">
<link rel="icon" sizes="32x32" href="assets/marca/icone-32.png">
<link rel="apple-touch-icon" href="assets/marca/icone-180.png">
<style>
/* Siga o dinheiro — só o que esta página acrescenta à base.
   Uma tela por fluxo: origem à esquerda, destino à direita, a linha cresce,
   o valor conta. O único vermelho é a ponta da seta quando chega. */
[hidden]{display:none!important}

.palco{border:1px solid var(--linha); padding:14px 14px 12px; margin:10px 0 0; background:var(--papel)}
.topo{
  display:flex; justify-content:space-between; gap:10px;
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--cinza); margin:0 0 6px;
}
.topo b{color:var(--tinta); font-weight:700}

/* o valor abre a leitura: grande, em reais, por extenso (mi -> milhões) */
.valor{text-align:center; margin:8px 0 14px; color:var(--amber); font-size:clamp(52px,17vw,112px); white-space:nowrap}
.valor #pre, .valor #suf{font-size:.4em; font-weight:700; letter-spacing:0}

.fluxo{display:grid; grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr); align-items:stretch; margin:0 0 12px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.caixa{
  border:1.5px solid var(--tinta); padding:9px 10px 10px; min-height:64px;
  display:flex; flex-direction:column; justify-content:center; overflow-wrap:anywhere;
}
.caixa .rot{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--cinza); margin:0 0 3px}
.caixa .nome{font-size:15px; line-height:1.3; font-weight:600; hyphens:auto; overflow-wrap:break-word; font-size:14px}
.seta{align-self:center; width:100%; height:32px; display:block; overflow:visible}
.seta line{stroke:var(--tinta); stroke-width:2}
.seta polygon{fill:var(--tinta); opacity:0; transition:opacity .15s}

.obs{font-size:15px; margin:0 0 10px}
.chip{text-transform:uppercase; line-height:1.5; margin-bottom:10px}
.fonte a{text-underline-offset:2px}

.acoes{margin-top:10px}
.acoes button{flex:1; min-height:44px}
.acoes button[disabled]{opacity:.35; cursor:default}
.acoes.nav{margin-top:8px}

.fecho{padding:26px 0 10px; text-align:center}
.fecho .frase{margin:0 auto 14px; max-width:22em}
.fecho .grande{
  display:inline-block; padding:10px 4px; min-height:44px; font-size:18px; font-weight:700;
  color:var(--tinta); text-decoration:underline; text-underline-offset:3px;
}
.fecho .acoes{justify-content:center}
.fecho .acoes button{flex:0 1 auto}

.assina{
  display:flex; justify-content:space-between; gap:10px; margin-top:14px; padding-top:10px;
  border-top:1px solid var(--linha); font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--cinza);
}
.assina b{color:var(--tinta)}

.vazio{padding:20px 0}
.obs{font-size:17px; line-height:1.4; margin:0 0 6px}
.acoes.envio{align-items:center; gap:6px 16px; margin-top:12px}
.acoes .env{flex:0 0 auto; min-height:44px; padding:0 20px; font-weight:700}
.foz-liga{margin:6px 0 0}
.lm{display:inline-flex; align-items:center; min-height:44px; padding:0; margin:2px 0 0; border:0; background:none; color:var(--cinza); font:600 14px var(--sans); cursor:pointer}
.mais{border-top:1px solid var(--linha); padding-top:10px; margin-bottom:6px}
/* ligação com a Foz: só nos fluxos que têm .foz nos dados */
.foz-liga{margin:0 0 12px; font-size:15px}
.foz-liga a{display:inline-flex; align-items:center; min-height:44px; font-weight:700; color:var(--amber); text-decoration:none}
.foz-liga a:hover{text-decoration:underline; text-underline-offset:3px}
.fecho .foz-fim{display:block; margin:0 auto 4px; color:var(--amber)}
.rodape{margin:28px 0 0; text-align:center; font-size:17px; font-weight:700}
.rodape a{color:var(--tinta); text-decoration:underline; text-underline-offset:3px; display:inline-block; padding:10px 4px}
</style>
</head>
<body data-trecho="2">

<header class="site-header" data-nav></header>

<main class="wrap">
  <h1 class="sec">Siga o dinheiro</h1>
  <p class="sub" id="sub">Um fluxo de cada vez.</p>

  <section class="palco" id="palco" aria-label="Fluxo de dinheiro">
    <div class="topo"><span id="ind" aria-live="polite"></span><span id="legenda"></span></div>

    <div id="cartao" hidden>
      <p class="numero valor" id="valor" role="img"><span id="pre"></span><span id="num"></span><span id="suf"></span></p>

      <div class="fluxo" id="fluxo" title="Toque para repetir a animação">
        <div class="caixa"><span class="rot">de</span><span class="nome" id="de"></span></div>
        <svg class="seta" id="seta" viewBox="0 0 100 32" aria-hidden="true" focusable="false">
          <line id="linha" x1="0" y1="16" x2="89" y2="16" stroke-dasharray="89" stroke-dashoffset="89"/>
          <polygon id="ponta" points="88,9 100,16 88,23"/>
        </svg>
        <div class="caixa"><span class="rot">para</span><span class="nome" id="para"></span></div>
      </div>

      <p class="obs" id="obs"></p>
      <p class="fonte" id="fonte"></p>
      <div class="acoes envio"><button type="button" class="env" id="zap" data-share="fluxo-1">enviar ↗</button></div>
      <p class="foz-liga" id="foz-liga" hidden><a id="foz-a" href="foz.html"></a><span id="foz-dh" hidden> · <a href="dark-horse.html">mês a mês →</a></span></p>
      <button type="button" class="lm" id="lm" aria-expanded="false">ler mais ↓</button>
      <div class="mais" id="mais" hidden>
        <div class="chip" id="chip"></div>
        <p class="fonte" id="fonte2" hidden></p>
        <p class="ressalva" id="ressalva"></p>
      </div>
      <div class="acoes nav">
        <button type="button" class="sec" id="ant">← Anterior</button>
        <button type="button" id="prox">Próximo fluxo →</button>
      </div>
    </div>

    <div class="fecho" id="fecho" hidden>
      <div class="acoes"><button type="button" class="env" data-share="siga">enviar ↗</button></div>
      <a class="grande foz-fim" href="foz.html" id="foz-fim">A Foz →</a>
      <a class="grande" href="drive.html#arquivo" data-registros>O arquivo completo →</a>
      <div class="acoes"><button type="button" class="sec" id="rever">← Rever do início</button></div>
    </div>

    <p class="ressalva vazio" id="vazio" hidden>Não há fluxos para mostrar. <a href="drive.html#arquivo" data-registros>Ver o arquivo completo →</a></p>

    <div class="assina"><span><b>BolsoDrive</b> · siga o dinheiro</span><span id="assina-n"></span></div>
  </section>

</main>

<noscript><p class="ressalva" style="text-align:center;padding:0 16px">Esta página precisa de JavaScript para mostrar os fluxos. <a href="drive.html#arquivo">Ver o arquivo completo →</a></p></noscript>

<script src="data/dados.js?v=set2026s"></script>
<script src="data/foz.js?v=14"></script>
<script src="data/topicos.js?v=5"></script>
<script src="assets/compartilhar.js?v=2" defer></script>
<script>
(function(){
'use strict';

var D = window.DOSSIE || {};
var FD = D.fluxoDinheiro || {};
var brutos = Array.isArray(FD.fluxos) ? FD.fluxos : [];

var FLUXOS = brutos.filter(function(f){ return f && typeof f.valor === 'string'; });
var N = FLUXOS.length;

/* "Ver os N registros": o número sai do arquivo, não do texto */
if (Array.isArray(D.itens) && D.itens.length){
  Array.prototype.forEach.call(document.querySelectorAll('[data-registros]'), function(a){ a.textContent = 'Ver os ' + D.itens.length + ' registros →'; });
}

function limpa(s){ return String(s || ''); }

/* A Foz (data/foz.js): o fluxo com .foz aponta para o escândalo em que aquele dinheiro chega.
   Um id que não existe mais segue FOZ.redireciona; sem destino, não há link. */
var FZ = window.FOZ || {};
var ESC = {}; (FZ.escandalos || []).forEach(function(e){ ESC[e.id] = e; });
function fozDe(id){
  if (!id) return null;
  if (ESC[id]) return ESC[id];
  var r = (FZ.redireciona || {})[id];
  return r && ESC[r] ? ESC[r] : null;
}
if ((FZ.escandalos || []).length){
  document.getElementById('foz-fim').textContent = 'A Foz: ' + FZ.escandalos.length + ' escândalos que chegam a ele →';
}

/* Status, ressalva e defesa vêm do próprio dado (fluxoDinheiro.fluxos[i].status / .ressalva / .defesa).
   A defesa só entra na ressalva quando ela ainda não traz a versão de quem é citado. */
var PADRAO = { chip:'Fato noticiado', classe:'nenhum', ressalva:'' };
function statusDe(f){
  var r = f.ressalva || '', d = f.defesa || '';
  if (d && r.indexOf(d.replace(/\.$/, '')) < 0 && !/\b(diz|afirma|nega)\b|improcedente/i.test(r)) r = r ? r + ' ' + d : d;
  return { chip: f.status || PADRAO.chip, classe: '', ressalva: r };
}

/* "R$ 2,08 mi" → prefixo "R$ ", número 2,08, sufixo " mi". O prefixo guarda "~" e "até". */
function partes(valor){
  var m = /^(.*?)(\d+(?:,\d+)?)(.*)$/.exec(valor);
  if (!m) return {pre:valor, num:'', suf:'', alvo:0, dec:0};
  var dec = (m[2].split(',')[1] || '').length;
  return {pre:m[1], num:m[2], suf:m[3], alvo:parseFloat(m[2].replace(',', '.')), dec:dec};
}
function fmt(v, dec){ return v.toFixed(dec).replace('.', ','); }
/* "R$ 60 mi" -> "R$ 60 milhões"; "R$ 1,6 mi" -> "R$ 1,6 milhão". Sempre em reais. */
function extenso(valor){
  return String(valor).replace(/(\d+(?:,\d+)?)\s*(mi|bi)\b\.?/g, function(_, n, u){
    var um = parseFloat(n.replace(',', '.')) < 2;
    return n + ' ' + (u === 'mi' ? (um ? 'milhão' : 'milhões') : (um ? 'bilhão' : 'bilhões'));
  });
}

var $ = function(id){ return document.getElementById(id); };
var el = {
  sub:$('sub'), palco:$('palco'), ind:$('ind'), cartao:$('cartao'), fecho:$('fecho'), vazio:$('vazio'),
  valor:$('valor'), pre:$('pre'), num:$('num'), suf:$('suf'), fluxo:$('fluxo'), seta:$('seta'),
  linha:$('linha'), ponta:$('ponta'), de:$('de'), para:$('para'), obs:$('obs'), chip:$('chip'),
  fonte:$('fonte'), fonte2:$('fonte2'), ressalva:$('ressalva'), zap:$('zap'), ant:$('ant'),
  prox:$('prox'), rever:$('rever'), assinaN:$('assina-n'), legenda:$('legenda'),
  fozLiga:$('foz-liga'), fozA:$('foz-a'), lm:$('lm'), mais:$('mais')
};
/* uma linha por fluxo (chave: o valor em DOSSIE.fluxoDinheiro.fluxos); o texto longo fica em "ler mais".
   Fluxo novo sem linha aqui mostra a 1ª frase de .obs. */
var LINHA = {
  'R$ 3,1 mi': 'Em 2021, aprovado pela diretoria de Paulo Henrique Costa, preso no caso Master.',
  'R$ 60 mi': '7 remessas em 2025, segundo a PF; ele é investigado no STF, sem denúncia.',
  'R$ 42 mi': 'Até 26/08/2026, pessoas físicas tinham doado R$ 6,01, segundo a prestação ao TSE.',
  'R$ 300 mil': 'Doação registrada no TSE e confirmada pelo doador.',
  'R$ 1,6 mi': 'Contrato declarado ao TSE com a agência de um ex-assessor de Tarcísio de Freitas.',
  'R$ 10,5 mi': 'Imóvel de R$ 14,5 milhões usado como QG da campanha; Santini diz que está tudo declarado.',
  'R$ 364 mi': 'Emendas de 2020 a 2026: 50,8% para saúde, 0,8% para educação.'
};
function linha(f){ return LINHA[f.valor] || (String(f.obs || '').split(/\.\s/)[0].replace(/\.$/, '') + '.'); }

var reduz = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var raf = 0, L = 89, prog = 0, atual = 0;

function medir(){
  var W = Math.max(40, Math.round(el.seta.getBoundingClientRect().width));
  el.seta.setAttribute('viewBox', '0 0 ' + W + ' 32');
  L = W - 11;
  el.linha.setAttribute('x2', L);
  el.linha.setAttribute('stroke-dasharray', L);
  el.ponta.setAttribute('points', (W - 12) + ',9 ' + W + ',16 ' + (W - 12) + ',23');
  aplicar(prog, prog >= 1);
}
function aplicar(e, chegou){
  el.linha.setAttribute('stroke-dashoffset', L * (1 - e));
  el.ponta.style.opacity = chegou ? 1 : 0;
}
function animar(pt){
  if (raf) cancelAnimationFrame(raf);
  if (reduz){ prog = 1; el.num.textContent = pt.num; aplicar(1, true); return; }
  var dur = 1200, t0 = performance.now();
  prog = 0; el.num.textContent = fmt(0, pt.dec); aplicar(0, false);
  function frame(t){
    var p = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3);
    prog = e;
    el.num.textContent = p >= 1 ? pt.num : fmt(pt.alvo * e, pt.dec);
    aplicar(e, p >= 0.97);
    if (p < 1) raf = requestAnimationFrame(frame); else raf = 0;
  }
  raf = requestAnimationFrame(frame);
}

function linkFonte(p, rotulo, f){
  while (p.firstChild) p.removeChild(p.firstChild);
  var ok = /^https?:\/\//.test(f.url || '');
  p.appendChild(document.createTextNode(rotulo + ': ' + (f.veiculo || 'fonte') + (ok ? ' · ' : '')));
  if (ok){
    var a = document.createElement('a');
    a.href = f.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'ver a fonte';
    p.appendChild(a);
  }
}
function setHash(h){ try { history.replaceState(null, '', '#' + h); } catch(e){} }

function mostrar(i){
  atual = i;
  if (i >= N){
    el.cartao.hidden = true; el.fecho.hidden = false; el.legenda.hidden = true;
    el.ind.textContent = 'fim · ' + N + ' fluxos';
    el.assinaN.textContent = 'fim';
    setHash('fim'); return;
  }
  var f = FLUXOS[i], s = statusDe(f), pt = partes(extenso(f.valor));
  el.fecho.hidden = true; el.cartao.hidden = false; el.legenda.hidden = false;
  el.ind.textContent = 'fluxo ' + (i + 1) + ' / ' + N;
  el.de.textContent = limpa(f.de);
  el.para.textContent = limpa(f.para);
  el.pre.textContent = pt.pre; el.suf.textContent = pt.suf;
  el.valor.setAttribute('aria-label', extenso(f.valor));
  el.obs.textContent = linha(f);
  el.chip.textContent = s.chip;
  el.chip.className = 'chip' + (s.classe ? ' ' + s.classe : '');
  linkFonte(el.fonte, 'Fonte', f.fonte || {});
  if (s.extra){ linkFonte(el.fonte2, 'Status', s.extra); el.fonte2.hidden = false; } else { el.fonte2.hidden = true; }
  el.ressalva.textContent = s.ressalva; el.ressalva.hidden = !s.ressalva;
  var fz = fozDe(f.foz);
  el.fozLiga.hidden = !fz;
  if (fz){ el.fozA.href = 'foz.html#' + encodeURIComponent(fz.id); el.fozA.textContent = 'Na Foz: ' + (fz.rotulo || fz.nome) + ' →'; }
  document.getElementById('foz-dh').hidden = !(fz && fz.id === 'master');   /* o afluente do filme, mês a mês (dark-horse.html) */
  el.zap.setAttribute('data-share', 'fluxo-' + (brutos.indexOf(f) + 1));
  el.mais.hidden = true; el.lm.textContent = 'ler mais ↓'; el.lm.setAttribute('aria-expanded', 'false');
  el.ant.disabled = (i === 0);
  el.prox.textContent = (i === N - 1) ? 'Concluir →' : 'Próximo fluxo →';
  el.assinaN.textContent = (i + 1) + '/' + N;
  setHash(i + 1);
  medir(); animar(pt);
}

function ir(d){ var i = atual + d; if (i < 0 || i > N) return; mostrar(i); window.scrollTo({top:0, behavior:reduz ? 'auto' : 'smooth'}); }

/* Enviar: o botão manda o tópico da tela (assets/compartilhar.js): "fluxo-<n>" em cada fluxo, "dinheiro" no fim.
   Sem o módulo, manda o fluxo em uma linha e o endereço dele. */
function base(){ return location.protocol === 'file:' ? location.href.split('#')[0] : location.origin + location.pathname; }
function mensagem(i){
  var f = FLUXOS[i];
  return extenso(f.valor) + ': ' + limpa(f.de) + ' → ' + limpa(f.para) + '. ' + linha(f) + '\n' + base() + '#' + (i + 1);
}
function envia(b, ev){
  ev.preventDefault(); ev.stopImmediatePropagation();
  var id = b.getAttribute('data-share');
  if (window.BDShare && typeof window.BDShare.enviar === 'function'){ window.BDShare.enviar(id); return; }
  var txt = atual < N ? mensagem(atual) : base();
  if (navigator.share){ navigator.share({text:txt}).catch(function(){}); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
}
Array.prototype.forEach.call(document.querySelectorAll('[data-share]'), function(b){ b.addEventListener('click', function(ev){ envia(b, ev); }); });
el.lm.addEventListener('click', function(){
  var ab = el.mais.hidden; el.mais.hidden = !ab;
  el.lm.textContent = ab ? 'ler menos ↑' : 'ler mais ↓'; el.lm.setAttribute('aria-expanded', String(ab));
});

/* Estado inicial */
if (N === 0){
  el.cartao.hidden = true; el.fecho.hidden = true; el.vazio.hidden = false; el.ind.textContent = 'sem fluxos';
  return;
}
el.sub.textContent = N + ' fluxos, um de cada vez.';

function deHash(){
  var h = (location.hash || '').slice(1);
  if (h === 'fim') return N;
  var n = parseInt(h, 10);
  return (n >= 1 && n <= N) ? n - 1 : 0;
}
mostrar(deHash());

el.prox.addEventListener('click', function(){ ir(1); });
el.ant.addEventListener('click', function(){ ir(-1); });
el.rever.addEventListener('click', function(){ mostrar(0); window.scrollTo({top:0, behavior:reduz ? 'auto' : 'smooth'}); });
el.fluxo.addEventListener('click', function(){ if (atual < N) animar(partes(extenso(FLUXOS[atual].valor))); });

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') ir(1);
  else if (e.key === 'ArrowLeft') ir(-1);
});

var tx = 0, ty = 0, tt = 0;
el.palco.addEventListener('touchstart', function(e){ var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); }, {passive:true});
el.palco.addEventListener('touchend', function(e){
  var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Date.now() - tt < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) ir(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('resize', function(){ if (atual < N) medir(); });
window.addEventListener('hashchange', function(){ var i = deHash(); if (i !== atual) mostrar(i); });
})();
</script>
<script src="assets/nav.js?v=5"></script>
</body>
</html>
